      { id:"I3-C77", part:"Phần I", chapter:"Chương 3", q:"Câu 77: Thời gian lưu thông là?", opts:["A. Thời gian mà tư bản nằm trong quá trình sản xuất","B. Thời gian để sản xuất ra hàng hóa","C. Thời gian vận chuyển hàng hóa từ nơi sản xuất đến nơi tiêu thụ","D. Thời gian mà tư bản chỉ tồn tại dưới hình thái tiền tệ và hàng hóa"], ans:3 },
      { id:"I3-C89", part:"Phần I", chapter:"Chương 3", q:"Câu 89: Vai trò chủ yếu của tư bản thương nghiệp trong nền kinh tế thị trường là:", opts:["A. Giảm giá cả hàng hóa","B. Tăng hiệu quả chu chuyển tư bản","C. Làm giảm cầu hàng hóa","D. Thúc đẩy tiến bộ khoa học kỹ thuật"], ans:1 },
      { id:"I3-C93", part:"Phần I", chapter:"Chương 3", q:"Câu 93: Sự hình thành lợi nhuận bình quân và giá cả sản xuất là kết quả của?", opts:["A. Cạnh tranh trong nội bộ ngành","B. Quy luật cung cầu","C. Độc quyền sản xuất","D. Cạnh tranh giữa các ngành"], ans:3 },
      { id:"I3-C98", part:"Phần I", chapter:"Chương 3", q:"Câu 98: Tư bản lưu động chuyển giá trị của nó thế nào?", opts:["A. Không chuyển vào sản phẩm","B. Chuyển từng phần vào giá trị sản phẩm theo mức độ hao mòn","C. Chuyển toàn bộ vào sản phẩm trong một chu kỳ sản xuất","D. Biến đổi liên tục"], ans:2 },

      // ===== PHẦN I - CHƯƠNG 4 =====
      { id:"I4-C8", part:"Phần I", chapter:"Chương 4", q:"Câu 8: Chủ nghĩa tư bản ngày nay có những đặc điểm mới nào so với thời Lênin?", opts:["A. Sản xuất nông nghiệp là chủ yếu","B. Vai trò của nhà nước giảm đi","C. Không còn độc quyền","D. Xuất hiện các công ty xuyên quốc gia"], ans:3 },
      { id:"I4-C9", part:"Phần I", chapter:"Chương 4", q:"Câu 9: Xuất khẩu tư bản hiện nay chủ yếu dưới hình thức nào?", opts:["A. Viện trợ không hoàn lại","B. Đầu tư trực tiếp nước ngoài","C. Hỗ trợ kỹ thuật","D. Chỉ cho vay"], ans:1 },
      { id:"I4-C21", part:"Phần I", chapter:"Chương 4", q:"Câu 21: Nguyên nhân ra đời của độc quyền nhà nước trong chủ nghĩa tư bản là do:", opts:["A. Xu thế quốc tế hóa đời sống kinh tế, sự gia tăng mâu thuẫn xã hội, nhu cầu ổn định kinh tế vĩ mô","B. Mong muốn của giai cấp công nhân","C. Nhu cầu phát triển độc lập","D. Sự phát triển của nông nghiệp"], ans:0 },
      { id:"I4-C30", part:"Phần I", chapter:"Chương 4", q:"Câu 30: Sự can thiệp của nhà nước tư sản vào kinh tế trong nền kinh tế thị trường tư bản chủ nghĩa nhằm mục đích gì?", opts:["A. Giảm lợi nhuận của các tập đoàn","B. Thực hiện chủ nghĩa xã hội","C. Xóa bỏ hoàn toàn độc quyền","D. Điều tiết kinh tế vĩ mô, khắc phục khủng hoảng, bảo vệ lợi ích của tư bản độc quyền"], ans:3 },
      { id:"I4-C37", part:"Phần I", chapter:"Chương 4", q:"Câu 37: Các chính sách phát triển kinh tế, thuế, an sinh xã hội và giáo dục, y tế hiện nay tại Việt Nam thể hiện rõ nhất đặc trưng nào của KTTT định hướng XHCN?", opts:["A. Tồn tại nhiều hình thức sở hữu và thành phần kinh tế","B. Tăng trưởng kinh tế gắn với công bằng và tiến bộ xã hội","C. Kinh tế nhà nước giữ vai trò chủ đạo, kinh tế tư nhân là động lực quan trọng","D. Thực hiện nhiều hình thức phân phối, chủ yếu phân phối theo lao động và hiệu quả kinh tế"], ans:1 },
      { id:"I4-C38", part:"Phần I", chapter:"Chương 4", q:"Câu 38: Hạn chế của độc quyền nhà nước trong chủ nghĩa tư bản là?", opts:["A. Thúc đẩy tăng trưởng quá nhanh","B. Làm sâu sắc thêm mâu thuẫn giữa tư bản độc quyền và toàn xã hội","C. Giảm thất nghiệp","D. Làm giảm lợi nhuận của các tập đoàn"], ans:1 },
      { id:"I4-C48", part:"Phần I", chapter:"Chương 4", q:"Câu 48: Độc quyền nhà nước trong chủ nghĩa tư bản là sự kết hợp giữa?", opts:["A. Nhà nước và các công ty tư nhân nhỏ lẻ","B. Sức mạnh của các tổ chức độc quyền tư nhân với sức mạnh của nhà nước tư sản","C. Kinh tế thị trường và kinh tế kế hoạch","D. Tư bản trong nước và tư bản nước ngoài"], ans:1 },
      { id:"I4-C51", part:"Phần I", chapter:"Chương 4", q:"Câu 51: Sự điều tiết của nhà nước tư sản thể hiện qua các chính sách nào?", opts:["A. Chỉ chính sách tiền tệ","B. Chỉ chính sách xã hội","C. Chỉ chính sách giáo dục","D. Chính sách tài khóa, tiền tệ, giá cả, thu nhập, đầu tư, xuất nhập khẩu"], ans:3 },
      { id:"I4-C61", part:"Phần I", chapter:"Chương 4", q:"Câu 61: Các hình thức chủ yếu của độc quyền nhà nước trong chủ nghĩa tư bản là?", opts:["A. Chỉ có sở hữu nhà nước","B. Chỉ có tư hữu hóa","C. Sở hữu nhà nước, sự điều tiết của nhà nước, kết hợp độc quyền nhà nước và độc quyền tư nhân","D. Chỉ có kế hoạch hóa tập trung"], ans:2 },
      { id:"I4-C64", part:"Phần I", chapter:"Chương 4", q:"Câu 64: Kết hợp độc quyền nhà nước tư sản với độc quyền tư nhân biểu hiện ở?", opts:["A. Chỉ trong các công ty quốc phòng","B. Chỉ khi có khủng hoảng kinh tế","C. Các liên minh độc quyền nhà nước - tư nhân, sự tham gia của đại diện độc quyền vào bộ máy nhà nước","D. Chỉ trong lĩnh vực dịch vụ công"], ans:2 },
      { id:"I4-C67", part:"Phần I", chapter:"Chương 4", q:"Câu 67: Các công ty xuyên quốc gia (TNCs) có vai trò gì trong chủ nghĩa tư bản hiện đại?", opts:["A. Hạn chế cạnh tranh","B. Chỉ hoạt động trong nước","C. Đóng vai trò ngày càng quan trọng trong sản xuất, thương mại, đầu tư toàn cầu, thúc đẩy quốc tế hóa","D. Chỉ sản xuất các mặt hàng tiêu dùng"], ans:2 },
      { id:"I4-C68", part:"Phần I", chapter:"Chương 4", q:"Câu 68: Ưu điểm của độc quyền nhà nước trong chủ nghĩa tư bản là?", opts:["A. Loại bỏ khủng hoảng kinh tế","B. Không có cạnh tranh","C. Có khả năng ổn định kinh tế vĩ mô, tập trung nguồn lực phát triển các ngành trọng yếu","D. Xóa bỏ hoàn toàn phân hóa giàu nghèo"], ans:2 },
      { id:"I4-C99", part:"Phần I", chapter:"Chương 4", q:"Câu 99: Nhà nước tư sản đảm nhận đầu tư vào ngành nào?", opts:["A. Đầu tư nhỏ, thu hồi vốn nhanh, lợi nhuận cao","B. Đầu tư lớn, thu hồi vốn chậm, lợi nhuận thấp","C. Đầu tư lớn, thu hồi vốn chậm, lợi nhuận cao","D. Đầu tư lớn, thu hồi vốn nhanh, lợi nhuận ít"], ans:1 },
      { id:"I4-C100", part:"Phần I", chapter:"Chương 4", q:"Câu 100: Giá cả sản xuất bằng?", opts:["A. Giá bán trên thị trường","B. Chi phí nguyên vật liệu","C. Giá trị hàng hóa cộng với lợi nhuận bình quân","D. Chi phí sản xuất cộng với lợi nhuận bình quân"], ans:3 },

      // ===== PHẦN II - CHƯƠNG 1 =====
      { id:"II1-C16", part:"Phần II", chapter:"Chương 1", q:"Câu 16: Thuật ngữ \"kinh tế chính trị\" xuất hiện lần đầu vào năm nào?", opts:["A. 1715","B. 1815","C. 1615","D. 1515"], ans:2 },
      { id:"II1-C25", part:"Phần II", chapter:"Chương 1", q:"Câu 25: Chủ nghĩa trọng nông cho rằng lĩnh vực nào tạo ra giá trị mới?", opts:["A. Công nghiệp","B. Tài chính","C. Thương nghiệp","D. Nông nghiệp"], ans:3 },
      { id:"II1-C26", part:"Phần II", chapter:"Chương 1", q:"Câu 26: Kinh tế chính trị theo nghĩa hẹp nghiên cứu điều gì?", opts:["A. Hệ thống chính trị","B. Các hoạt động tiêu dùng","C. Quan hệ sản xuất và trao đổi trong một phương thức sản xuất nhất định","D. Quy luật thị trường"], ans:2 },
      { id:"II1-C34", part:"Phần II", chapter:"Chương 1", q:"Câu 34: Trọng tâm nghiên cứu của Chủ nghĩa trọng thương là lĩnh vực nào?", opts:["A. Nông nghiệp","B. Tài chính","C. Công nghiệp","D. Lưu thông – thương nghiệp"], ans:3 },

      // ===== PHẦN II - CHƯƠNG 2 =====
      { id:"II2-C2", part:"Phần II", chapter:"Chương 2", q:"Câu 2: Mâu thuẫn cơ bản của sản xuất hàng hóa là mâu thuẫn giữa?", opts:["A. Sản xuất và tiêu dùng","B. Cung và cầu","C. Lao động cụ thể và lao động trừu tượng","D. Lao động giản đơn và lao động phức tạp"], ans:2 },
      { id:"II2-C5", part:"Phần II", chapter:"Chương 2", q:"Câu 5: Hàng hóa có hai thuộc tính là?", opts:["A. Giá trị sử dụng và giá trị","B. Giá trị và giá cả","C. Giá cả và giá trị trao đổi","D. Giá cả và công dụng"], ans:0 },
      { id:"II2-C7", part:"Phần II", chapter:"Chương 2", q:"Câu 7: Nền kinh tế hàng hóa hình thành và phát triển khi có các điều kiện nào?", opts:["A. Phân công lao động xã hội và chế độ công hữu về tư liệu sản xuất","B. Phân công lao động cá biệt và chế độ tư hữu về tư liệu sản xuất","C. Phân công lao động xã hội và sự tách biệt về kinh tế giữa các chủ thể sản xuất","D. Phân công lao động và hệ thống thể chế kinh tế"], ans:2 },
      { id:"II2-C9", part:"Phần II", chapter:"Chương 2", q:"Câu 9: Hai điều kiện để sức lao động trở thành hàng hóa:", opts:["A. Có kỹ năng và kinh nghiệm","B. Người lao động tự do và không sở hữu tư liệu sản xuất","C. Có bằng cấp và sức khỏe","D. Có giấy phép và hợp đồng"], ans:1 },
      { id:"II2-C10", part:"Phần II", chapter:"Chương 2", q:"Câu 10: Ý nào sau đây KHÔNG ĐÚNG?", opts:["A. Lượng giá trị hàng hóa = hao phí lao động quá khứ + hao phí lao động mới kết tinh thêm","B. Lượng giá trị hàng hóa = c+v+m","C. Lượng giá trị hàng hóa = chi phí sản xuất + giá trị thặng dư","D. Lượng giá trị hàng hóa = chi phí sản xuất + lợi nhuận"], ans:3 },
      { id:"II2-C11", part:"Phần II", chapter:"Chương 2", q:"Câu 11: Giá trị của hàng hóa là?", opts:["A. Sự khan hiếm của hàng hóa trên thị trường","B. Hao phí lao động xã hội của người sản xuất hàng hóa kết tinh trong hàng hóa","C. Công dụng của hàng hóa có thể thỏa mãn nhu cầu nào đó của con người","D. Giá cả hàng hóa"], ans:1 },
      { id:"II2-C12", part:"Phần II", chapter:"Chương 2", q:"Câu 12: Khi cường độ lao động tăng lên, tổng lượng giá trị tạo ra trong một đơn vị thời gian sẽ?", opts:["A. Không thay đổi","B. Giảm xuống","C. Không thể xác định","D. Tăng lên"], ans:3 },
      { id:"II2-C18", part:"Phần II", chapter:"Chương 2", q:"Câu 18: Hàng hóa sức lao động có giá trị và giá trị sử dụng đặc biệt vì?", opts:["A. Gắn với lao động trí óc","B. Là tài sản vô hình","C. Có thể tạo ra giá trị mới lớn hơn bản thân nó","D. Không có giá cả"], ans:2 },
      { id:"II2-C19", part:"Phần II", chapter:"Chương 2", q:"Câu 19: Lao động trừu tượng là gì?", opts:["A. Sự hao phí sức lao động trong sản xuất công nghiệp","B. Sự hao phí sức lao động nói chung của người sản xuất hàng hóa","C. Lao động tạo ra giá trị sử dụng","D. Sự hao phí sức lao động trong sản xuất nông nghiệp"], ans:1 },
      { id:"II2-C22", part:"Phần II", chapter:"Chương 2", q:"Câu 22: Ngày lao động là 8h, m'=100%, nhà tư bản tăng ngày lao động lên 1h và giá trị sức lao động giảm 25%. Vậy tỷ suất giá trị thặng dư mới là bao nhiêu?", opts:["A. 200%","B. 250%","C. 300%","D. 150%"], ans:0 },
      { id:"II2-C31", part:"Phần II", chapter:"Chương 2", q:"Câu 31: Lượng giá trị của hàng hóa được đo bằng?", opts:["A. Thời gian lao động cá biệt","B. Thời gian lao động của người làm việc hiệu quả nhất","C. Tổng thời gian lao động","D. Thời gian lao động xã hội cần thiết"], ans:3 },
      { id:"II2-C32", part:"Phần II", chapter:"Chương 2", q:"Câu 32: Nhân tố nào là cơ bản, lâu dài để tăng sản phẩm và hiệu quả kinh tế cho xã hội?", opts:["A. Tăng số lượng lao động","B. Tăng năng suất lao động","C. Tăng cường độ lao động","D. Tăng thời gian lao động"], ans:1 },
      { id:"II2-C40", part:"Phần II", chapter:"Chương 2", q:"Câu 40: Hàng hóa có hai thuộc tính do lao động của người sản xuất hàng hóa có tính hai mặt là:", opts:["A. Lao động cụ thể và lao động trừu tượng","B. Lao động tư nhân và lao động xã hội","C. Lao động giản đơn và lao động phức tạp","D. Lao động tay chân và lao động trí óc"], ans:0 },
      { id:"II2-C42", part:"Phần II", chapter:"Chương 2", q:"Câu 42: Hàng hóa là?", opts:["A. Sản phẩm của lao động có thể thỏa mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán","B. Sản phẩm của lao động phục vụ nhu cầu sử dụng của người sản xuất","C. Sản phẩm phục vụ tiêu dùng","D. Sản phẩm phục vụ sản xuất"], ans:0 },
      { id:"II2-C44", part:"Phần II", chapter:"Chương 2", q:"Câu 44: Lao động giản đơn là loại lao động nào?", opts:["A. Lao động trong công nghiệp","B. Lao động trong nông nghiệp","C. Không đòi hỏi quá trình đào tạo một cách có hệ thống, chuyên sâu cũng có thể thao tác được","D. Phải trải qua quá trình đào tạo chuyên môn theo các tiêu chuẩn nghề nghiệp khác nhau"], ans:2 },
      { id:"II2-C45", part:"Phần II", chapter:"Chương 2", q:"Câu 45: Giá trị sử dụng của hàng hóa thể hiện ở?", opts:["A. Tổng cầu của hàng hóa trên thị trường","B. Công dụng của hàng hóa có thể thỏa mãn nhu cầu nào đó của con người","C. Giá cả của hàng hóa","D. Hao phí lao động xã hội của người sản xuất hàng hóa kết tinh trong hàng hóa"], ans:1 },
      { id:"II2-C60", part:"Phần II", chapter:"Chương 2", q:"Câu 60: Lao động phức tạp là loại lao động nào?", opts:["A. Lao động trong công nghiệp","B. Không đòi hỏi quá trình đào tạo một cách có hệ thống, chuyên sâu","C. Lao động trong nông nghiệp","D. Phải trải qua quá trình đào tạo chuyên môn theo các tiêu chuẩn nghề nghiệp khác nhau"], ans:3 },

      // ===== PHẦN III - CHƯƠNG 2 =====
      { id:"III2-C3", part:"Phần III", chapter:"Chương 2", q:"Câu 3: Theo quy luật lưu thông tiền tệ, lượng tiền giấy được phát hành và đưa vào lưu thông phải căn cứ vào:", opts:["A. Lượng tiền cần thiết cho lưu thông trong một thời kỳ nhất định","B. Chính sách tiền lương","C. Tổng chi ngân sách nhà nước trong một năm","D. Chính sách đầu tư công"], ans:0 },
      { id:"III2-C9", part:"Phần III", chapter:"Chương 2", q:"Câu 9: Khi một ngành có giá cả hàng hóa tăng và cao hơn giá trị sẽ dẫn đến hiện tượng:", opts:["A. Các doanh nghiệp có xu hướng liên kết để tạo ra quyền lực độc quyền","B. Các doanh nghiệp giảm chi tiêu cho thay đổi công nghệ","C. Các doanh nghiệp ồ ạt rút lui khỏi ngành","D. Các doanh nghiệp mới gia nhập vào ngành tăng"], ans:3 },
      { id:"III2-C11", part:"Phần III", chapter:"Chương 2", q:"Câu 11: Khi giá cả hàng hóa tăng, lượng cung sẽ có xu hướng:", opts:["A. Không thay đổi","B. Tăng hoặc giảm tùy thuộc vào loại hàng hóa","C. Tăng","D. Giảm"], ans:2 },
      { id:"III2-C14", part:"Phần III", chapter:"Chương 2", q:"Câu 14: Vai trò của cạnh tranh trong nền kinh tế thị trường là:", opts:["A. Phân hóa xã hội","B. Đảm bảo giá cả thị trường ổn định","C. Thúc đẩy nâng cao hiệu quả sản xuất kinh doanh, phát triển lực lượng sản xuất","D. Tạo ra tình trạng khan hiếm hàng hóa, dịch vụ"], ans:2 },
      { id:"III2-C15", part:"Phần III", chapter:"Chương 2", q:"Câu 15: Theo yêu cầu của Quy luật giá trị, người sản xuất phải:", opts:["A. Tăng giá trị cá biệt luôn lớn hơn hoặc bằng giá trị thị trường của hàng hóa","B. Giảm số lượng lao động tri thức, tăng số lượng lao động giản đơn","C. Giảm giá trị cá biệt xuống nhỏ hơn hoặc bằng giá trị thị trường của hàng hóa","D. Giảm sản lượng nhằm tác động lên tổng cung hàng hóa trên thị trường"], ans:2 },
      { id:"III2-C22", part:"Phần III", chapter:"Chương 2", q:"Câu 22: Vai trò nào sau đây của nhà nước trong nền kinh tế thị trường là quan trọng nhất?", opts:["A. Cung cấp hàng hóa và dịch vụ công cộng","B. Tạo ra lợi nhuận tối đa cho các doanh nghiệp nhà nước","C. Điều tiết thị trường, khắc phục các khuyết tật của kinh tế thị trường và đảm bảo công bằng xã hội","D. Quản lý giá cả"], ans:2 },
      { id:"III2-C24", part:"Phần III", chapter:"Chương 2", q:"Câu 24: Mục tiêu cơ bản của người sản xuất trong nền kinh tế thị trường là?", opts:["A. Tối đa hóa lợi nhuận","B. Tối đa hóa tỷ suất lợi nhuận","C. Tăng khả năng cạnh tranh","D. Tối đa hóa doanh thu"], ans:0 },
      { id:"III2-C26", part:"Phần III", chapter:"Chương 2", q:"Câu 26: Kết quả của cạnh tranh nội bộ ngành là gì?", opts:["A. Kìm hãm sự phát triển của khoa học công nghệ","B. Hình thành các tổ chức độc quyền","C. Hình thành giá trị thị trường của từng loại hàng hóa","D. Thiết lập mặt bằng giá cả thị trường cao hơn"], ans:2 },
      { id:"III2-C28", part:"Phần III", chapter:"Chương 2", q:"Câu 28: Tư bản giả là gì?", opts:["A. Tư bản được sử dụng trong hoạt động kinh doanh phi sản xuất","B. Các loại chứng khoán (cổ phiếu, trái phiếu, …)","C. Tư bản không có giá trị thật","D. Tư bản được tạo ra từ lừa đảo"], ans:1 },
      { id:"III2-C31", part:"Phần III", chapter:"Chương 2", q:"Câu 31: Vai trò cơ bản của các chủ thể trung gian trong thị trường là?", opts:["A. Môi giới trên thị trường tài chính","B. Làm cầu nối xúc tiến đầu tư trực tiếp nước ngoài","C. Thực hiện chuyển giao công nghệ","D. Làm cầu nối giữa các chủ thể sản xuất, tiêu dùng hàng hóa - dịch vụ trên thị trường"], ans:3 },
      { id:"III2-C34", part:"Phần III", chapter:"Chương 2", q:"Câu 34: Yếu tố quyết định nhất đến giá cả hàng hóa là:", opts:["A. Sự thay đổi giá trị tiền tệ","B. Giá trị sử dụng của hàng hóa","C. Giá trị của hàng hóa","D. Quan hệ cung - cầu về hàng hóa"], ans:2 },
      { id:"III2-C35", part:"Phần III", chapter:"Chương 2", q:"Câu 35: Cạnh tranh trong nền kinh tế thị trường là gì?", opts:["A. Một tổ chức kinh tế có thể kiểm soát giá cả và sản lượng của một loại hàng hóa","B. Việc sát nhập – hợp nhất giữa các doanh nghiệp","C. Sự ganh đua giữa các chủ thể kinh tế nhằm thu được lợi ích tối đa","D. Sự kiểm soát của nhà nước đối với hoạt động sản xuất kinh doanh"], ans:2 },
      { id:"III2-C39", part:"Phần III", chapter:"Chương 2", q:"Câu 39: Trái phiếu là gì?", opts:["A. Giấy tờ xác nhận một khoản vay nợ của công ty hoặc chính phủ, cam kết trả lãi cố định","B. Giấy tờ xác nhận một tài sản bảo đảm của công ty","C. Giấy tờ xác nhận quyền sở hữu một phần tư bản của công ty","D. Hợp đồng mua bán tài sản"], ans:0 },
      { id:"III2-C40", part:"Phần III", chapter:"Chương 2", q:"Câu 40: Quy luật lưu thông tiền tệ là quy luật kinh tế quy định:", opts:["A. Lãi suất trái phiếu chính phủ","B. Tỷ giá hối đoái giữa đồng tiền nội tệ với các loại ngoại tệ","C. Tổng chi ngân sách nhà nước trong một năm","D. Lượng tiền cần thiết cho lưu thông hàng hóa trong một thời kỳ nhất định"], ans:3 },
      { id:"III2-C50", part:"Phần III", chapter:"Chương 2", q:"Câu 50: Chính sách tiền tệ nới lỏng nhằm kích thích tăng trưởng kinh tế và giảm tỷ lệ thất nghiệp thông qua:", opts:["A. Giảm Cung tiền","B. Giảm chi tiêu của chính phủ","C. Tăng Cung tiền","D. Tăng đầu tư công"], ans:2 },
      { id:"III2-C61", part:"Phần III", chapter:"Chương 2", q:"Câu 61: Nếu lượng tiền phát hành vượt quá lượng tiền cần thiết cho lưu thông sẽ dẫn đến hiện tượng:", opts:["A. Lạm phát","B. Giá cả ổn định","C. Tăng trưởng kinh tế bền vững","D. Giảm phát"], ans:0 },
      { id:"III2-C66", part:"Phần III", chapter:"Chương 2", q:"Câu 66: Thị trường chứng khoán là nơi diễn ra hoạt động gì?", opts:["A. Mua bán hàng hóa tiêu dùng","B. Mua bán bất động sản","C. Mua bán, trao đổi các giấy tờ có giá (cổ phiếu, trái phiếu, ...)","D. Mua bán ngoại tệ"], ans:2 },
      { id:"III2-C67", part:"Phần III", chapter:"Chương 2", q:"Câu 67: Cổ phiếu là gì?", opts:["A. Giấy tờ mua bán hàng hóa","B. Giấy tờ xác nhận quyền sở hữu một phần tư bản của công ty và quyền hưởng cổ tức","C. Giấy tờ xác nhận một khoản vay nợ của công ty","D. Chứng chỉ vay nợ của công ty"], ans:1 },
      { id:"III2-C82", part:"Phần III", chapter:"Chương 2", q:"Câu 82: Khi trên thị trường cầu lớn hơn cung, giá cả hàng hóa sẽ có xu hướng?", opts:["A. Ổn định","B. Giảm","C. Tăng hoặc giảm tùy thuộc vào loại hàng hóa","D. Tăng"], ans:3 },
      { id:"III2-C89", part:"Phần III", chapter:"Chương 2", q:"Câu 89: Vai trò định hướng sản xuất của người tiêu dùng được thể hiện thông qua?", opts:["A. Việc họ kiểm soát giá cả thị trường","B. Việc họ tham gia vào các chính sách của nhà nước","C. Sự lựa chọn và quyết định mua hàng của họ","D. Việc họ sản xuất ra sản phẩm mới"], ans:2 },
      { id:"III2-C90", part:"Phần III", chapter:"Chương 2", q:"Câu 90: Khái niệm \"Cung\" trong nền kinh tế thị trường được hiểu là:", opts:["A. Người cung cấp hàng hóa, dịch vụ","B. Người mua hàng hóa, dịch vụ","C. Số lượng hàng hóa, dịch vụ mà người sản xuất sẵn sàng và có khả năng cung cấp ra thị trường tại các mức giá khác nhau","D. Tổng sản phẩm quốc nội"], ans:2 },
      { id:"III2-C93", part:"Phần III", chapter:"Chương 2", q:"Câu 93: Chính sách tài khóa có thể tác động đến tăng trưởng kinh tế thông qua:", opts:["A. Thay đổi lãi suất","B. Kiểm soát lạm phát","C. Điều chỉnh thuế và chi tiêu chính phủ","D. Thu hút đầu tư nước ngoài"], ans:2 },
      { id:"III2-C96", part:"Phần III", chapter:"Chương 2", q:"Câu 96: Khi Lượng cầu về hàng hóa tăng, giá cả hàng hóa sẽ có xu hướng:", opts:["A. Tăng hoặc giảm tùy thuộc vào loại hàng hóa","B. Giảm","C. Tăng","D. Không thay đổi"], ans:2 },
      { id:"III2-C99", part:"Phần III", chapter:"Chương 2", q:"Câu 99: Công ty cổ phần là hình thức tổ chức kinh doanh nào?", opts:["A. Công ty trách nhiệm hữu hạn hai thành viên trở lên","B. Công ty tư nhân","C. Công ty hợp danh","D. Công ty mà tư bản của nó được chia thành nhiều phần bằng nhau gọi là cổ phần"], ans:3 },
      { id:"III2-C100", part:"Phần III", chapter:"Chương 2", q:"Câu 100: Chính sách kinh tế nào sau đây KHÔNG PHẢI là sự vận dụng quy luật cung cầu trong kích thích tăng trưởng kinh tế?", opts:["A. Chính sách kích cầu","B. Chính sách tiền tệ nới lỏng","C. Chính sách tăng cường đầu tư công","D. Chính sách tiền tệ thắt chặt"], ans:3 },

      // ===== PHẦN III - CHƯƠNG 3 =====
      { id:"III3-C1", part:"Phần III", chapter:"Chương 3", q:"Câu 1: Địa tô chênh lệch I là loại địa tô thu được trên?", opts:["A. Đất đai có độ màu mỡ trung bình và xấu","B. Đất đai không có điều kiện sản xuất tốt","C. Đất đai có vị trí thuận lợi, gần thị trường tiêu thụ","D. Đất đai có độ màu mỡ cao và vị trí thuận lợi hơn"], ans:3 },
      { id:"III3-C6", part:"Phần III", chapter:"Chương 3", q:"Câu 6: Lợi tức là gì?", opts:["A. Lợi nhuận thu được trong cho thuê bất động sản","B. Phần giá trị thặng dư mà nhà tư bản đi vay trả cho nhà tư bản cho vay","C. Lợi nhuận thu được trong đầu tư sản xuất công nghiệp","D. Phần chênh lệch giữa giá mua và giá bán của nhà tư bản thương nghiệp"], ans:1 },
      { id:"III3-C21", part:"Phần III", chapter:"Chương 3", q:"Câu 21: Khi hàng hoá bán đúng giá trị thì:", opts:["A. p = 0","B. p = m","C. p > m","D. p < m"], ans:1 },
      { id:"III3-C33", part:"Phần III", chapter:"Chương 3", q:"Câu 33: Những yếu tố dưới đây, yếu tố nào KHÔNG thuộc tư bản cố định?", opts:["A. Nguyên vật liệu, điện, nước dùng cho sản xuất","B. Nhà xưởng","C. Thiết bị, máy móc","D. Các phương tiện vận tải"], ans:0 },
      { id:"III3-C49", part:"Phần III", chapter:"Chương 3", q:"Câu 49: Chi phí thực tế của xã hội để sản xuất ra hàng hoá là gì?", opts:["A. Chi phí mua tư liệu sản xuất","B. Chi phí do nhà tư bản ứng ra để mua nguyên vật liệu","C. Chi phí sử dụng lao động sống và chi phí lao động quá khứ","D. Chi phí nhượng quyền thương hiệu"], ans:2 },
      { id:"III3-C55", part:"Phần III", chapter:"Chương 3", q:"Câu 55: Nguồn gốc của tư bản cho vay là:", opts:["A. Tư bản sử dụng trong lĩnh vực thương mại","B. Tư bản sử dụng trong đầu tư tài chính","C. Tư bản sử dụng trong lĩnh vực sản xuất","D. Tư bản tiền tệ tạm thời nhàn rỗi"], ans:3 },
      { id:"III3-C60", part:"Phần III", chapter:"Chương 3", q:"Câu 60: Trong các hình thức tư bản dưới đây, tư bản cho vay KHÔNG bắt nguồn từ hình thức nào?", opts:["A. Tiền gửi tiết kiệm của người lao động","B. Tư bản công nghiệp tham gia sản xuất trực tiếp","C. Tư bản tạm thời nhàn rỗi của các công ty","D. Vốn tích luỹ từ ngân sách nhà nước"], ans:1 },
      { id:"III3-C62", part:"Phần III", chapter:"Chương 3", q:"Câu 62: Tỷ suất lợi tức phụ thuộc vào yếu tố nào?", opts:["A. Mức lợi nhuận bình quân và quan hệ cung cầu về tư bản cho vay","B. Tỷ suất lợi nhuận trung bình trong lĩnh vực thương nghiệp","C. Năng suất lao động","D. Giá cả thị trường"], ans:0 },
      { id:"III3-C73", part:"Phần III", chapter:"Chương 3", q:"Câu 73: Dựa vào căn cứ nào để chia tư bản thành tư bản bất biến và tư bản khả biến?", opts:["A. Vai trò các bộ phận tư bản trong quá trình sản xuất giá trị thặng dư","B. Tốc độ chu chuyển của tư bản","C. Phương thức chuyển giá trị các bộ phận tư bản vào giá trị sản phẩm","D. Mức độ hao mòn của tư bản cố định"], ans:0 },

      // ===== PHẦN III - CHƯƠNG 4 =====
      { id:"III4-C2", part:"Phần III", chapter:"Chương 4", q:"Câu 2: Chọn đáp án SAI - Chức năng của sở hữu độc quyền nhà nước:", opts:["A. Mở rộng sản xuất tư bản chủ nghĩa, bảo đảm địa bàn rộng lớn cho sự phát triển của độc quyền","B. Làm chỗ dựa cho điều tiết kinh tế của nhà nước theo các chương trình nhất định","C. Nhà nước nắm giữ những ngành kinh tế trọng yếu để điều tiết, chi phối nền kinh tế","D. Tạo điều kiện thuận lợi cho việc di chuyển tư bản của các tổ chức độc quyền từ ngành lợi nhuận thấp sang cao"], ans:0 },
      { id:"III4-C8", part:"Phần III", chapter:"Chương 4", q:"Câu 8: Nguyên nhân chủ yếu dẫn đến hình thành lợi nhuận độc quyền là gì?", opts:["A. Cạnh tranh gay gắt giữa các doanh nghiệp vừa và nhỏ","B. Chính sách thuế ưu đãi của nhà nước","C. Địa vị thống trị thị trường của các tổ chức tư bản độc quyền","D. Tăng trưởng năng suất lao động trong khu vực công"], ans:2 },
      { id:"III4-C20", part:"Phần III", chapter:"Chương 4", q:"Câu 20: Mục đích của xuất khẩu tư bản là?", opts:["A. Bù đắp sự thiếu hụt tư bản ở các nước khác","B. Tăng cường hợp tác quốc tế","C. Tìm kiếm lợi nhuận độc quyền cao và giải quyết vấn đề thừa tư bản","D. Giúp đỡ các nước kém phát triển"], ans:2 },
      { id:"III4-C25", part:"Phần III", chapter:"Chương 4", q:"Câu 25: Trong giai đoạn độc quyền, nhà nước tư sản có vai trò?", opts:["A. Phục vụ lợi ích của giai cấp tư sản độc quyền","B. Trung lập","C. Chỉ bảo vệ người lao động","D. Không can thiệp vào kinh tế"], ans:0 },
      { id:"III4-C29", part:"Phần III", chapter:"Chương 4", q:"Câu 29: Nguyên nhân tồn tại địa tô tuyệt đối là do?", opts:["A. Chính sách bảo hộ sản xuất nông nghiệp","B. Độc quyền sở hữu ruộng đất","C. Đất đai khan hiếm","D. Nhu cầu lương thực tăng cao"], ans:1 },
      { id:"III4-C30", part:"Phần III", chapter:"Chương 4", q:"Câu 30: Độc quyền nhà nước trong chủ nghĩa tư bản ra đời là sự kết hợp?", opts:["A. Lợi ích của nhà nước và nhân dân","B. Các quy luật khách quan và ý chí chủ quan","C. Lợi ích của công nhân và nhà tư bản","D. Lợi ích của toàn xã hội"], ans:1 },
      { id:"III4-C37", part:"Phần III", chapter:"Chương 4", q:"Câu 37: Lợi nhuận độc quyền cao là do?", opts:["A. Khả năng định giá, chi phối thị trường của các tổ chức độc quyền","B. Nhà nước kiểm soát giá","C. Năng suất lao động cao","D. Cạnh tranh lành mạnh"], ans:0 },
      { id:"III4-C44", part:"Phần III", chapter:"Chương 4", q:"Câu 44: Sự xuất hiện của độc quyền trong nền kinh tế thị trường tư bản chủ nghĩa là một quá trình?", opts:["A. Tự giác và có kế hoạch","B. Do ý chí chủ quan của nhà nước","C. Khách quan, tuân theo quy luật tập trung sản xuất và tư bản","D. Tự phát và không có quy luật"], ans:2 },
      { id:"III4-C47", part:"Phần III", chapter:"Chương 4", q:"Câu 47: Giá cả ruộng đất là gì?", opts:["A. Địa tô thu được trên đất đai có điều kiện sản xuất tốt nhất","B. Địa tô thu được trên đất đai có điều kiện sản xuất xấu nhất","C. Địa tô thu được trên đất đai có điều kiện sản xuất trung bình","D. Địa tô quy về một lần, được xác định trên cơ sở địa tô và lãi suất ngân hàng"], ans:3 },
      { id:"III4-C48", part:"Phần III", chapter:"Chương 4", q:"Câu 48: Địa tô độc quyền là loại địa tô thu được đối với?", opts:["A. Đất đai có vị trí đặc biệt","B. Đất đai do nhà nước quản lý","C. Đất đai có tính chất đặc biệt","D. Đất đai được cải tạo"], ans:2 },
      { id:"III4-C59", part:"Phần III", chapter:"Chương 4", q:"Câu 59: Đặc điểm nổi bật của chủ nghĩa tư bản hiện nay về mặt sở hữu là?", opts:["A. Đa dạng hóa sở hữu (công ty cổ phần, sở hữu nhà nước, tư nhân)","B. Chỉ có sở hữu nhà nước","C. Chỉ có sở hữu tư nhân nhỏ","D. Chỉ có sở hữu tập thể"], ans:0 },
      { id:"III4-C65", part:"Phần III", chapter:"Chương 4", q:"Câu 65: Địa tô tư bản chủ nghĩa là gì?", opts:["A. Lợi nhuận mà người nông dân thu được","B. Giá trị của đất đai","C. Phần giá trị thặng dư dôi ra ngoài lợi nhuận bình quân, do nhà tư bản nông nghiệp nộp cho địa chủ","D. Thuế mà nhà nước thu từ đất đai"], ans:2 },
      { id:"III4-C72", part:"Phần III", chapter:"Chương 4", q:"Câu 72: Hình thức tổ chức độc quyền tờ-rớt khác với các-ten ở chỗ?", opts:["A. Tờ-rớt sáp nhập các doanh nghiệp, mất quyền tự chủ sản xuất và kinh doanh","B. Tờ-rớt là thỏa thuận không chính thức","C. Tờ-rớt chỉ hoạt động trong một ngành duy nhất","D. Tờ-rớt chỉ kiểm soát giá cả"], ans:0 },
      { id:"III4-C74", part:"Phần III", chapter:"Chương 4", q:"Câu 74: Đâu KHÔNG PHẢI là đặc điểm kinh tế của độc quyền trong chủ nghĩa tư bản?", opts:["A. Tư bản tài chính hình thành","B. Sự tập trung sản xuất và các tổ chức độc quyền đóng vai trò quyết định","C. Xuất khẩu tư bản","D. Cạnh tranh tự do hoàn toàn"], ans:3 },
      { id:"III4-C76", part:"Phần III", chapter:"Chương 4", q:"Câu 76: Các-ten là hình thức tổ chức độc quyền mà ở đó có sự thỏa thuận giữa các doanh nghiệp về?", opts:["A. Tiền lương công nhân","B. Công nghệ sản xuất","C. Giá cả, sản lượng, thị trường tiêu thụ","D. Sáp nhập toàn bộ"], ans:2 },
      { id:"III4-C79", part:"Phần III", chapter:"Chương 4", q:"Câu 79: Địa tô tuyệt đối là loại địa tô thu được trên?", opts:["A. Đất có độ màu mỡ và vị trí tốt nhất","B. Đất đai thuộc sở hữu nhà nước","C. Tất cả mọi loại đất đai","D. Đất đai có độ màu mỡ kém nhất"], ans:2 },
      { id:"III4-C81", part:"Phần III", chapter:"Chương 4", q:"Câu 81: Sự hình thành tư bản tài chính trong chủ nghĩa tư bản làm cho?", opts:["A. Ngân hàng và công nghiệp hoàn toàn độc lập","B. Nền kinh tế trở nên phân tán","C. Các tập đoàn công nghiệp và ngân hàng gắn bó chặt chẽ, tạo ra quyền lực tài chính","D. Các doanh nghiệp nhỏ chiếm ưu thế"], ans:2 },
      { id:"III4-C83", part:"Phần III", chapter:"Chương 4", q:"Câu 83: Các ngân hàng trong giai đoạn độc quyền?", opts:["A. Không có vai trò quan trọng","B. Chỉ thực hiện chức năng thanh toán","C. Chỉ cho vay tiêu dùng","D. Trở thành những người khổng lồ, chi phối tư bản công nghiệp"], ans:3 },
      { id:"III4-C87", part:"Phần III", chapter:"Chương 4", q:"Câu 87: Ý nào dưới đây là đúng nhất theo lý luận Mác về địa tô?", opts:["A. Địa tô xuất hiện nhờ cải cách ruộng đất","B. Địa tô chênh lệch hình thành do giá cả thị trường","C. Địa tô tuyệt đối gắn liền với độc quyền tư hữu ruộng đất","D. Địa tô là sản phẩm của nền kinh tế kế hoạch"], ans:2 },
      { id:"III4-C91", part:"Phần III", chapter:"Chương 4", q:"Câu 91: Địa vị độc quyền cho phép các tổ chức độc quyền trong chủ nghĩa tư bản có khả năng?", opts:["A. Hỗ trợ doanh nghiệp nhỏ","B. Chi phối giá cả, thị trường, thu lợi nhuận độc quyền cao","C. Hạn chế cạnh tranh","D. Đảm bảo công bằng xã hội"], ans:1 },
    ];

    const PARTS = ["Tất cả", "Phần I", "Phần II", "Phần III"];
    const CHAPTERS = ["Tất cả", "Chương 1", "Chương 2", "Chương 3", "Chương 4"];
    const OPT_LABELS = ["A", "B", "C", "D"];

    // Cấu hình bảng màu Sáng / Tối
    const getColors = (isDark) => {
      return isDark ? {
        pageBg: "#060f1a", bg: "#0a1f35", text: "#d4e8f8", textMuted: "#4d7fa8",
        primary: "#4fc3f7", border: "#1e3a5f",
        optBg: "#0d2137", optBgSelected: "#1a3a5c",
        optText: "#c8d8e8", optTextSelected: "#4fc3f7",
        optBorder: "#1e3a5f", optBorderSelected: "#4fc3f7",
        optLabelBg: "#1e3a5f", optLabelBgSelected: "#4fc3f7",
        optLabelText: "#7fb3d3", optLabelTextSelected: "#000000",
        correctBg: "rgba(39,174,96,0.2)", correctText: "#27ae60",
        wrongBg: "rgba(231,76,60,0.2)", wrongText: "#e74c3c",
        submitBtn: "#27ae60"
      } : {
        pageBg: "#f0f2f5", bg: "#ffffff", text: "#2d3748", textMuted: "#718096",
        primary: "#3182ce", border: "#e2e8f0",
        optBg: "#ffffff", optBgSelected: "#ebf8ff",
        optText: "#4a5568", optTextSelected: "#2b6cb0",
        optBorder: "#e2e8f0", optBorderSelected: "#3182ce",
        optLabelBg: "#edf2f7", optLabelBgSelected: "#3182ce",
        optLabelText: "#4a5568", optLabelTextSelected: "#ffffff",
        correctBg: "#c6f6d5", correctText: "#22543d",
        wrongBg: "#fed7d7", wrongText: "#822727",
        submitBtn: "#38a169"
      };
    };

    function QuizApp() {
      const [isDark, setIsDark] = useState(false);
      const [selPart, setSelPart] = useState("Tất cả");
      const [selChap, setSelChap] = useState("Tất cả");
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [mode, setMode] = useState("filter");

      const colors = getColors(isDark);

      // Thay đổi màu nền body để đồng bộ giao diện
      useEffect(() => {
        document.body.style.backgroundColor = colors.pageBg;
      }, [isDark, colors.pageBg]);

      const filtered = useMemo(() => {
        return ALL_QUESTIONS.filter(q =>
          (selPart === "Tất cả" || q.part === selPart) &&
          (selChap === "Tất cả" || q.chapter === selChap)
        );
      }, [selPart, selChap]);

      const score = useMemo(() => {
        if (!submitted) return 0;
        return filtered.filter(q => answers[q.id] === q.ans).length;
      }, [submitted, filtered, answers]);

      const handleSelect = (qId, optIdx) => {
        if (submitted) return;
        setAnswers(prev => ({ ...prev, [qId]: optIdx }));
      };

      const startQuiz = () => {
        setAnswers({});
        setSubmitted(false);
        setCurrentIdx(0);
        setMode("quiz");
      };

      const handleSubmit = () => {
        // Có thể nộp bài bất kỳ lúc nào, hiển thị hộp thoại xác nhận nếu chưa làm xong
        const answeredCount = Object.keys(answers).length;
        if (answeredCount < filtered.length) {
            if(!window.confirm(`Bạn mới làm ${answeredCount}/${filtered.length} câu. Bạn có chắc chắn muốn nộp bài sớm không?`)) {
                return;
            }
        }
        setSubmitted(true);
        setMode("review");
        setCurrentIdx(0);
      };

      const reset = () => {
        if (mode === "quiz" && Object.keys(answers).length > 0 && !submitted) {
            if(!window.confirm("Dữ liệu đang làm sẽ bị mất. Bạn muốn quay lại?")) return;
        }
        setAnswers({});
        setSubmitted(false);
        setMode("filter");
        setCurrentIdx(0);
      };

      const answered = filtered.filter(q => q.id in answers).length;
      const pct = filtered.length > 0 ? Math.round((score / filtered.length) * 100) : 0;

      // CHẾ ĐỘ LÀM BÀI (QUIZ)
      if (mode === "quiz") {
        const q = filtered[currentIdx];
        const userAns = answers[q.id];

        return (
          <div style={{...styles.root, backgroundColor: colors.pageBg}}>
            <div style={{...styles.header, backgroundColor: colors.bg, borderBottomColor: colors.border}}>
              <button style={{...styles.btnOutline, color: colors.textMuted, borderColor: colors.border}} onClick={reset}>
                ← Quay lại
              </button>
              <button style={{...styles.btnOutline, color: colors.textMuted, borderColor: colors.border}} onClick={() => setIsDark(!isDark)}>
                {isDark ? "☀️ Sáng" : "🌙 Tối"}
              </button>
            </div>

            <div style={styles.progressBar}>
              <div style={{ ...styles.progressFill, width: `${((currentIdx+1)/filtered.length)*100}%` }} />
            </div>
            
            <div style={{textAlign: "center", marginTop: 12}}>
               <span style={{ fontSize: 13, color: colors.primary, background: colors.optLabelBg, padding: "4px 10px", borderRadius: 20, fontWeight: 500 }}>
                 {q.part} · {q.chapter}
               </span>
               <div style={{ fontSize: 13, color: colors.textMuted, marginTop: 8, fontWeight: 500 }}>
                 Câu {currentIdx+1} / {filtered.length}
               </div>
            </div>

            <div style={{...styles.questionCard, backgroundColor: colors.bg, borderColor: colors.border}}>
              <div style={{...styles.questionText, color: colors.text}}>{q.q}</div>
              <div style={styles.optList}>
                {q.opts.map((opt, i) => {
                  const isSelected = userAns === i;
                  return (
                    <button
                      key={i}
                      style={{
                        ...styles.optBtn,
                        background: isSelected ? colors.optBgSelected : colors.optBg,
                        border: isSelected ? `2px solid ${colors.optBorderSelected}` : `2px solid ${colors.optBorder}`,
                        color: isSelected ? colors.optTextSelected : colors.optText,
                        transform: isSelected ? "translateX(6px)" : "none",
                      }}
                      onClick={() => handleSelect(q.id, i)}
                    >
                      <span style={{
                        ...styles.optLabel,
                        background: isSelected ? colors.optLabelBgSelected : colors.optLabelBg,
                        color: isSelected ? colors.optLabelTextSelected : colors.optLabelText
                      }}>{OPT_LABELS[i]}</span>
                      {opt.replace(/^[A-D]\.\s/, "")}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={styles.navRow}>
              <button style={{...styles.navBtn, background: colors.bg, color: colors.text, borderColor: colors.border, opacity: currentIdx === 0 ? 0.4 : 1}} 
                      onClick={() => setCurrentIdx(Math.max(0, currentIdx-1))} disabled={currentIdx===0}>
                ← Câu trước
              </button>
              
              <button style={{...styles.submitBtn, backgroundColor: colors.submitBtn}} onClick={handleSubmit}>
                Nộp bài ({answered}/{filtered.length})
              </button>

              <button style={{...styles.navBtn, background: colors.bg, color: colors.text, borderColor: colors.border, opacity: currentIdx === filtered.length - 1 ? 0.4 : 1}} 
                      onClick={() => setCurrentIdx(Math.min(filtered.length - 1, currentIdx+1))} disabled={currentIdx === filtered.length - 1}>
                Câu tiếp →
              </button>
            </div>
            
            <div style={{display: 'flex', justifyContent: 'center', gap: 6, margin: "10px 0"}}>
                {filtered.slice(Math.max(0,currentIdx-3), Math.min(filtered.length, currentIdx+4)).map((_, i) => {
                  const idx = Math.max(0, currentIdx-3) + i;
                  const isCurrent = idx === currentIdx;
                  const isAnswered = answers[filtered[idx]?.id] !== undefined;
                  return <div key={idx} style={{ 
                    ...styles.dot, 
                    background: isCurrent ? colors.primary : isAnswered ? colors.submitBtn : colors.border 
                  }} />;
                })}
            </div>
          </div>
        );
      }

      // CHẾ ĐỘ KẾT QUẢ (REVIEW)
      if (mode === "review") {
        return (
          <div style={{...styles.root, backgroundColor: colors.pageBg}}>
            <div style={{...styles.header, backgroundColor: colors.bg, borderBottomColor: colors.border}}>
              <button style={{...styles.btnOutline, color: colors.textMuted, borderColor: colors.border}} onClick={reset}>
                ← Quay lại
              </button>
              <button style={{...styles.btnOutline, color: colors.textMuted, borderColor: colors.border}} onClick={() => setIsDark(!isDark)}>
                {isDark ? "☀️ Sáng" : "🌙 Tối"}
              </button>
            </div>

            <div style={{...styles.scoreCard, backgroundColor: colors.bg, borderColor: colors.border}}>
              <div style={styles.scoreCircle}>
                <div style={{...styles.scoreNum, color: colors.primary}}>{score}</div>
                <div style={{...styles.scoreDen, color: colors.textMuted}}>/{filtered.length}</div>
              </div>
              <div style={{...styles.scorePct, color: colors.submitBtn}}>{pct}%</div>
              <div style={{...styles.scoreMsg, color: colors.text}}>
                {pct >= 80 ? "🎉 Xuất sắc!" : pct >= 60 ? "👍 Khá tốt!" : "📚 Cần ôn tập thêm"}
              </div>
            </div>

            <div style={styles.reviewList}>
              {filtered.map((q) => {
                const ua = answers[q.id];
                const correct = ua === q.ans;
                // Nếu chưa trả lời, xem như sai và hiển thị đáp án đúng
                const isSkipped = ua === undefined; 

                return (
                  <div key={q.id} style={{ ...styles.reviewItem, backgroundColor: colors.bg, borderColor: colors.border, borderLeft: `4px solid ${correct ? colors.correctText : colors.wrongText}` }}>
                    <div style={{...styles.reviewQ, color: colors.text}}>
                      <span style={{ color: correct ? colors.correctText : colors.wrongText, marginRight: 8, fontWeight: 'bold' }}>
                        {correct ? "✓" : (isSkipped ? "⚠" : "✗")}
                      </span>
                      {q.q}
                      {isSkipped && <span style={{marginLeft: 6, fontSize: 12, color: colors.wrongText}}>(Chưa chọn)</span>}
                    </div>
                    <div style={styles.reviewOpts}>
                      {q.opts.map((opt, i) => {
                        const isCorrect = i === q.ans;
                        const isUser = i === ua;
                        let bg = "transparent";
                        let textColor = colors.textMuted;
                        
                        if (isCorrect) { bg = colors.correctBg; textColor = colors.correctText; }
                        else if (isUser && !correct) { bg = colors.wrongBg; textColor = colors.wrongText; }
                        
                        return (
                          <div key={i} style={{ ...styles.reviewOpt, background: bg, color: textColor }}>
                            <span style={{ fontWeight: 700, marginRight: 8 }}>{OPT_LABELS[i]}.</span>
                            {opt.replace(/^[A-D]\.\s/, "")}
                            {isCorrect && <span style={{ marginLeft: 8, fontWeight: 'bold' }}>✓</span>}
                            {isUser && !correct && <span style={{ marginLeft: 8, fontWeight: 'bold' }}>← bạn chọn</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            <button style={{ ...styles.submitBtn, margin: "24px auto", display: "block", width: "calc(100% - 32px)", maxWidth: "400px", backgroundColor: colors.primary }} onClick={reset}>
              🔄 Làm lại từ đầu
            </button>
          </div>
        );
      }

      // CHẾ ĐỘ CHỌN ĐỀ (FILTER - Default)
      return (
        <div style={{...styles.root, backgroundColor: colors.pageBg}}>
          <div style={{...styles.header, backgroundColor: colors.bg, borderBottomColor: colors.border}}>
            <span style={{...styles.logo, color: colors.primary}}>📘 KTCT Mác-Lênin</span>
            <button style={{...styles.btnOutline, color: colors.textMuted, borderColor: colors.border}} onClick={() => setIsDark(!isDark)}>
              {isDark ? "☀️ Sáng" : "🌙 Tối"}
            </button>
          </div>

          <div style={{...styles.filterCard, backgroundColor: colors.bg, borderColor: colors.border}}>
            <div style={{...styles.filterLabel, color: colors.textMuted}}>Chọn Phần</div>
            <div style={styles.filterRow}>
              {PARTS.map(p => (
                <button key={p} style={{ 
                  ...styles.filterBtn, 
                  background: selPart===p ? colors.primary : colors.bg, 
                  color: selPart===p ? "#ffffff" : colors.text, 
                  border: selPart===p ? `1px solid ${colors.primary}` : `1px solid ${colors.border}` 
                }} onClick={() => setSelPart(p)}>{p}</button>
              ))}
            </div>

            <div style={{...styles.filterLabel, color: colors.textMuted}}>Chọn Chương</div>
            <div style={styles.filterRow}>
              {CHAPTERS.map(c => (
                <button key={c} style={{ 
                  ...styles.filterBtn, 
                  background: selChap===c ? colors.primary : colors.bg, 
                  color: selChap===c ? "#ffffff" : colors.text, 
                  border: selChap===c ? `1px solid ${colors.primary}` : `1px solid ${colors.border}` 
                }} onClick={() => setSelChap(c)}>{c}</button>
              ))}
            </div>

            <div style={styles.countRow}>
              <span style={{...styles.countNum, color: colors.primary}}>{filtered.length}</span>
              <span style={{...styles.countLabel, color: colors.textMuted}}> câu hỏi được chọn</span>
            </div>

            {filtered.length > 0 && (
              <button style={{...styles.startBtn, background: colors.primary}} onClick={startQuiz}>
                ▶ Bắt đầu làm bài
              </button>
            )}
          </div>

          <div style={styles.statsGrid}>
            {["Phần I","Phần II","Phần III"].map(p => {
              const chs = ["Chương 1","Chương 2","Chương 3","Chương 4"];
              return (
                <div key={p} style={{...styles.statCard, backgroundColor: colors.bg, borderColor: colors.border}}>
                  <div style={{...styles.statTitle, color: colors.primary}}>{p}</div>
                  {chs.map(c => {
                    const n = ALL_QUESTIONS.filter(q => q.part===p && q.chapter===c).length;
                    return n > 0 ? (
                      <div key={c} style={styles.statRow}>
                        <span style={{...styles.statChap, color: colors.text}}>{c}</span>
                        <span style={{...styles.statNum, color: colors.textMuted, background: colors.optLabelBg}}>{n} câu</span>
                      </div>
                    ) : null;
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const styles = {
      root: { minHeight: "100vh", padding: "0 0 40px", maxWidth: "600px", margin: "0 auto", boxShadow: "0 0 20px rgba(0,0,0,0.05)", transition: "background-color 0.3s" },
      header: { padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid", position: "sticky", top: 0, zIndex: 10, transition: "all 0.3s" },
      logo: { fontSize: 18, fontWeight: 700, letterSpacing: 0.5 },
      btnOutline: { padding: "6px 12px", borderRadius: 8, background: "transparent", border: "1px solid", cursor: "pointer", fontSize: 13, fontWeight: 600, fontFamily: "inherit" },

      progressBar: { height: 4, background: "transparent", position: "relative" },
