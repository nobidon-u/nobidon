<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#18202E;--mute:#5B6678;--line:#DDE2EA;--red:#B4232E;--rbg:#FBE9EA;--ok:#1F7A4D;--obg:#E3F3EA;--sel:#E6ECF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#18202C;--ink:#E8ECF2;--mute:#98A3B5;--line:#2B3546;--red:#EE7078;--rbg:#3A1B1F;--ok:#52C08A;--obg:#163326;--sel:#22304A}}
:root[data-theme="dark"]{--bg:#10151D;--card:#18202C;--ink:#E8ECF2;--mute:#98A3B5;--line:#2B3546;--red:#EE7078;--rbg:#3A1B1F;--ok:#52C08A;--obg:#163326;--sel:#22304A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font:600 24px/1.25 "Source Serif 4",Georgia,serif;margin:8px 0 2px}h2{font-size:18px;margin:0 0 4px}
.m{color:var(--mute);margin:2px 0 12px;font-size:14px}
nav{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;color:var(--mute);cursor:pointer}
nav button[aria-current=true]{color:var(--red);border-color:var(--red);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
label{display:block;margin:8px 0;font-size:14px}select,input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-left:6px}
input[type=search]{width:100%;margin:0 0 8px}.chk input{margin-right:6px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--red);color:#fff;border-color:var(--red);font-weight:500}button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mute)}.bar #tm{margin-left:auto;font-weight:700;color:var(--ink)}
.tag{background:var(--sel);border-radius:6px;padding:0 7px;font-size:13px}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 14px}.prog i{display:block;height:100%;background:var(--red);border-radius:2px}
.stem{font:600 20px/1.5 "Source Serif 4",Georgia,serif;border-left:4px solid var(--red);padding-left:12px;margin:0 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:12px;line-height:1.45}.opt b{min-width:1.4em;color:var(--mute)}
.opt.sel{background:var(--sel);border-color:var(--red)}.opt.ok{background:var(--obg);border-color:var(--ok)}.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--rbg);border-color:var(--red)}.opt.bad b{color:var(--red)}
.nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.nav .sp{margin-left:auto}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}.g{width:38px;padding:5px 0;font-size:13px}.g.a{background:var(--sel)}.g.c{border-color:var(--red);font-weight:700}
.big{font:600 44px/1.1 "Source Serif 4",Georgia,serif;color:var(--red);margin:4px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}.item h3{font-size:16px;margin:0 0 6px;font-weight:500}
.item ul{list-style:none;margin:0;padding:0}.item li{padding:3px 6px;border-radius:6px;font-size:15px}.item li b{color:var(--mute);margin-right:6px}.item li.ok{background:var(--obg);color:var(--ok);font-weight:500}
.item .no{font-size:14px;margin:2px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="w">
<h1>Ôn tập Lịch sử Đảng</h1><p class="m">270 câu trắc nghiệm dành cho sinh viên · đáp án đúng lấy từ file gốc</p>

<script>
const Q=[["Điền từ còn thiếu vào chỗ trống: “Đảng Cộng sản Việt Nam là đội tiền phong của giai cấp công nhân, đồng thời là đội tiền phong của nhân dân lao động và của dân tộc Việt Nam, đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của dân tộc. Đảng lấy chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động, lấy ……làm nguyên tắc tổ chức cơ bản” (Văn kiện Đại hội XI của Đảng)", ["Phê bình và tự phê bình", "Tập trung dân chủ", "Đoàn kết thống nhất trong Đảng", "Kỷ luật nghiêm minh, tự giác"], 1], ["Đối tượng nghiên cứu của khoa học Lịch sử Đảng Cộng sản Việt Nam là:", ["Các cán bộ, đảng viên Đảng Cộng sản Việt Nam", "Những mặt hạn chế trong quá trình lãnh đạo của Đảng", "Sự ra đời, phát triển và hoạt động lãnh đạo của Đảng qua các thời kỳ lịch sử", "Các văn kiện của Đảng chuẩn bị được lưu hành"], 2], ["Là một ngành của khoa học lịch sử, Lịch sử Đảng Cộng sản Việt Nam có các chức năng, nhiệm vụ của khoa học lịch sử, đồng thời còn có thêm các chức năng nổi bật khác là:", ["Chức năng nhận thức, điều tiết, chọn lọc và tìm kiếm", "Chức năng nhận thức, giáo dục, dự báo và phê phán", "Chức năng tuyên truyền, phổ cập, giáo huấn và phổ quát", "Chức năng giáo dục, sàng lọc, tuyên truyền và tìm kiếm"], 1], ["Một trong những nhiệm vụ hàng đầu khi nghiên cứu khoa học Lịch sử Đảng Cộng sản Việt Nam là:", ["Khẳng định, chứng minh giá trị khoa học của những mục tiêu chiến lược và sách lược cách mạng mà Đảng đề ra trong cương lĩnh", "Làm cho người học hiểu được quyền lực của Đảng, từ đó thêm trung thành với đường lối lãnh đạo của Đảng", "Chọn lọc ra những sự kiện lịch sử nổi bật để tái hiện lại sự thành công trong quá trình lãnh đạo của Đảng", "Tìm hiểu về lịch sử ra đời của đảng cộng sản trên thế giới"], 0], ["Trong phương pháp nghiên cứu, học tập môn học Lịch sử Đảng Cộng sản Việt Nam cần phải dựa trên phương pháp luận khoa học mác-xít, đồng thời phải nắm vững chủ nghĩa nào dưới đây để xem xét và nhận thức lịch sử một cách khách quan, trung thực và đúng quy luật?", ["Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử", "Chủ nghĩa duy vật và chủ nghĩa duy tâm", "Chủ nghĩa duy lý và chủ nghĩa duy vật biện chứng", "Chủ nghĩa duy lý và chủ nghĩa duy vật lịch sử"], 0], ["Tại sao khi nghiên cứu, học tập Lịch sử Đảng Cộng sản Việt Nam lại cần phải nhận thức và vận dụng chủ nghĩa duy vật lịch sử?", ["Để thấy được sự ưu việt của Đảng Cộng sản Việt Nam so với các đảng phái ở phương Tây", "Để nhận thức tiến trình cách mạng do Đảng Cộng sản Việt Nam lãnh đạo", "Để hiểu được sứ mệnh lịch sử của giai cấp nông dân trong lãnh đạo cách mạng", "Để hiểu vì sao cách mạng giải phóng dân tộc ở Việt Nam đi theo con đường tư sản"], 1], ["Trong nghiên cứu Lịch sử Đảng Cộng sản Việt Nam, khi xem xét, đối chiếu các hiện tượng lịch sử trong hình thức tổng quát nhằm mục đích vạch ra bản chất, quy luật, khuynh hướng chung trong sự vận động của sự vật thì đó là cách nghiên cứu dựa trên:", ["Phương pháp lịch sử", "Phương pháp chọn lọc", "Phương pháp làm việc nhóm", "Phương pháp logic"], 3], ["Cần phải coi trọng phương pháp tổng kết thực tiễn lịch sử gắn với nghiên cứu lý luận trong nghiên cứu Lịch sử Đảng Cộng sản Việt Nam để:", ["Làm rõ kinh nghiệm, bài học, quy luật phát triển của cách mạng Việt Nam", "Làm hài lòng người dân trong quá trình lãnh đạo cách mạng của Đảng", "Dễ dàng thống kê những thành tựu mà Đảng đạt được trong lãnh đạo cách mạng", "Chứng tỏ sự linh hoạt trong các bước đề ra đường lối, chủ trương của Đảng"], 0], ["Việc tiến hành thảo luận, trao đổi các vấn đề do giảng viên đưa ra để có thể hiểu rõ hơn nội dung của môn học Lịch sử Đảng Cộng sản Việt Nam thì được gọi là:", ["Phương pháp làm việc khách quan", "Phương pháp làm việc nhóm", "Phương pháp làm việc chủ quan", "Phương pháp làm việc biện chứng"], 1], ["Một trong những ý nghĩa của việc nghiên cứu, học tập môn học Lịch sử Đảng Cộng sản Việt Nam đối với sinh viên là:", ["Tích cực cổ vũ, tham gia vào quá trình “tự diễn biến”, “tự chuyển hoá” trong Đảng", "Giáo dục lý tưởng, truyền thống đấu tranh của Đảng, bồi đắp niềm tin vào sự lãnh đạo của Đảng", "Tin vào sự lãnh đạo của Đảng đưa đất nước tiến nhanh, mạnh, vững chắc theo con đường tư bản chủ nghĩa", "Tham gia xây dựng cải cách, cải tổ Đảng theo mô hình của Đông Âu và Liên Xô nhằm làm cho Đảng thêm vững mạnh"], 1], ["Mâu thuẫn cơ bản của xã hội Việt Nam kể từ khi Pháp xâm lược là gì?", ["Mâu thuẫn giữa dân tộc ta với thực dân Pháp, mâu thuẫn giữa nông dân với địa chủ phong kiến", "Mâu thuẫn giữa công nhân với tư bản, mâu thuẫn giữa nông dân với địa chủ phong kiến", "Mâu thuẫn giữa nông dân với địa chủ phong kiến, mâu thuẫn giữa tư sản với vô sản", "Mâu thuẫn giữa nông dân, công nhân với địa chủ phong kiến"], 0], ["Ở Việt Nam, giai cấp mới nào đã ra đời dưới tác động của cuộc khai thác thuộc địa lần thứ nhất (1897 - 1914) của thực dân Pháp?", ["Tư sản", "Nông dân", "Công nhân", "Tiểu tư sản"], 2], ["Trước khi thực dân Pháp nổ súng xâm lược (1858), xã hội Việt Nam có những giai cấp cơ bản nào?", ["Địa chủ phong kiến và nông dân", "Địa chủ phong kiến và công nhân", "Công nhân và nông dân", "Nông dân và tri thức"], 0], ["Các phong trào yêu nước ở Việt Nam trước khi có Đảng Cộng sản lãnh đạo có điểm chung là:", ["Không nhận được sự ủng hộ của người dân, đặc biệt là giai cấp công - nông", "Không thông qua ý kiến của Quốc tế Cộng sản, đặc biệt Đảng Cộng sản Liên Xô", "Không có đường lối rõ ràng dẫn đến thất bại và bị thực dân Pháp đàn áp một cách nặng nề", "Không có đủ tiềm lực tài chính và người đứng đầu lãnh đạo cách mạng"], 2], ["Thực dân Pháp đã thực hiện chính sách gì về văn hoá xã hội để cai trị nước ta?", ["Ngu dân", "Bế quan toả cảng", "Đốt sách chôn Nho", "Chia để trị"], 0], ["Tầng lớp tư sản mại bản của Việt Nam dưới thời Pháp thuộc có đặc điểm là:", ["Có sự tham gia vào đời sống chính trị, kinh tế của chính quyền thực dân Pháp", "Có tiềm lực kinh tế mạnh, là giai cấp đông đảo nhất trong xã hội", "Không có tư liệu sản xuất, phải bán sức lao động trong các nhà máy, xí nghiệp", "Chịu ba tầng áp bức, bóc lột: đế quốc, phong kiến và tư sản dân tộc"], 0], ["Vì sao tầng lớp tiểu tư sản lại không thể là lực lượng lãnh đạo cách mạng chống Pháp?", ["Vì địa vị kinh tế, chính trị của họ gắn chặt với Pháp", "Vì lực lượng này hoàn toàn không có mâu thuẫn về quyền lợi với thực dân Pháp", "Vì địa vị kinh tế của họ bấp bênh, thái độ hay dao động", "Vì lực lượng này nhận được nhiều cảm tình của thực dân Pháp"], 2], ["Cuối thế kỷ XIX - đầu thế kỷ XX, nhiệm vụ hàng đầu cần phải được giải quyết cấp thiết của cách mạng Việt Nam là:", ["Giải phóng dân tộc", "Đấu tranh giai cấp", "Canh tân đất nước", "Chia lại ruộng đất"], 0], ["Sự kiện nào đã đánh dấu phong trào công nhân Việt Nam hoàn toàn trở thành một phong trào tự giác?", ["Năm 1920, khi tổ chức công hội ở Sài Gòn được thành lập", "Năm 1925, khi cuộc bãi công ở nhà máy Ba Son diễn ra rầm rộ", "Năm 1929, khi có sự ra đời của ba tổ chức cộng sản", "Năm 1930, khi Đảng Cộng sản Việt Nam ra đời"], 3], ["Sự kiện nào được Nguyễn Ái Quốc đánh giá “như chim én nhỏ báo hiệu mùa xuân”?", ["Cách mạng Tháng Mười Nga bùng nổ và thắng lợi (1917)", "Sự thành lập Đảng Cộng sản Pháp (1920)", "Vụ mưu sát viên toàn quyền Méc-Lanh của Phạm Hồng Thái (1924)", "Sự ra đời của Hội Việt Nam cách mạng Thanh niên (1925)"], 2], ["Phong trào đình công, bãi công của công nhân Việt Nam trong những năm 1926 - 1929 thuộc khuynh hướng nào?", ["Khuynh hướng phong kiến", "Khuynh hướng dân chủ tư sản", "Khuynh hướng vô sản", "Khuynh hướng dân chủ"], 2], ["Ai là người đại diện cho chủ trương đánh đuổi thực dân Pháp giành độc lập dân tộc, khôi phục chủ quyền quốc gia bằng biện pháp bạo động?", ["Bùi Quang Chiêu", "Phan Châu Trinh", "Phan Bội Châu", "Nguyễn Ái Quốc"], 2], ["Sự kiện nào đánh dấu bước ngoặt trong cuộc đời hoạt động cách mạng của Nguyễn Ái Quốc - từ người yêu nước trở thành người cộng sản?", ["Bỏ phiếu tán thành việc gia nhập Quốc tế III và tham gia thành lập Đảng Cộng sản Pháp", "Đọc bản Sơ th a trong vòng nửa cuối năm 1929 đã khẳng định điều gì?", ["Cách mạng Việt Nam đã có bước phát triển về chất, phù hợp với yêu cầu của lịch sử", "Cách mạng Việt Nam đã vượt qua khủng hoảng về đường lối lãnh đạo", "Cách mạng Việt Nam đã đủ mạnh để đương đầu với thực dân Pháp", "Cách mạng Việt Nam đã trở thành một bộ phận của cách mạng thế giới"], 0], ["Trước tình hình các tổ chức cộng sản hoạt động biệt lập, bài xích lẫn nhau đã dẫn đến một yêu cầu bức thiết cho cách mạng Việt Nam lúc đó là:", ["Giải tán các tổ chức cộng sản", "Giảng hoà sự bài xích, biệt lập giữa các tổ chức cộng sản", "Thống nhất các tổ chức cộng sản", "Kiểm điểm nghiêm túc các tổ chức cộng sản"], 2], ["Trong Cương lĩnh chính trị đầu tiên, Đảng xác định “mục tiêu chiến lược của cách mạng Việt Nam là ……và thổ địa cách mạng để đi tới xã hội cộng sản.” Từ còn thiếu trong chỗ trống là:", ["Xã hội chủ nghĩa", "Dân quyền cách mạng", "Dân tộc dân chủ", "Dân tộc dân chủ nhân dân"], 1], ["Cương lĩnh chính trị đầu tiên của Đảng được thông qua tại Hội nghị thành lập Đảng Cộng sản Việt Nam ngày 3/2/1930 đã xác định giai cấp nào là lực lượng lãnh đạo cách mạng?", ["Giai cấp tư sản", "Giai cấp công nhân", "Giai cấp nông dân", "Giai cấp địa chủ"], 1], ["Sự kiện nào được Nguyễn Ái Quốc đánh giá “giai cấp vô sản ta đã trưởng thành và đủ sức lãnh đạo cách mạng”?", ["Hội nghị Thành lập Đảng Cộng sản Việt Nam (1930)", "Chi bộ Cộng sản đầu tiên của Việt Nam ra đời (1929)", "Thành lập tổ chức Công hội đỏ Bắc Kỳ (1929)", "Sự ra đời của ba tổ chức Cộng sản (1929)"], 0], ["Hai văn kiện nào dưới đây được coi như là Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam?", ["Chánh cương vắn tắt và Lời kêu gọi của Đảng", "Sách lược vắn tắt và Lời kêu gọi của Đảng", "Chánh cương vắn tắt và Sách lược vắn tắt của Đảng", "Sách lược vắn tắt và Chương trình tóm tắt của Đảng"], 2], ["Nội dung nào sau đây nằm trong Cương lĩnh chính trị đầu tiên của Đảng?", ["Đánh đổ đế quốc Pháp và phong kiến, làm cho nước Nam hoàn toàn độc lập", "Tư các cấp chính quyền phải:", ["Duy trì lối làm việc theo hướng tả khuynh, giáo điều trong công sở", "Khắc phục và bỏ ngay những thói hư, tật xấu", "Khai trừ ra khỏi Đảng những Đảng viên yếu kém về năng lực", "Tạm dừng kiện toàn bộ máy chính quyền các cấp"], 1], ["Sau ngày bầu cử (6/1/1946), Quốc hội mới đã tập trung vào công việc quan trọng nhất lúc bấy giờ là:", ["Tổ chức những cuộc khai hoang, xây dựng cuộc sống mới cho dân nghèo", "Kêu gọi người dân góp tiền và hiện vật để ủng hộ cho ngân khố quốc gia", "Tổ chức cuộc kháng chiến chống thực dân Pháp xâm lược ở Nam Bộ", "Xây dựng hệ thống các trường đại học, cao đẳng hiện đại"], 2], ["Hội đồng cố vấn Chính phủ Cách mạng lâm thời được thành lập năm 1945 do ai đứng đầu?", ["Vĩnh Thụy", "Phạm Văn Đồng", "Hồ Chí Minh", "Nguyễn Hải Thần"], 0], ["Cuộc kháng chiến chống Pháp xâm lược lần thứ hai của nhân dân ta được diễn ra vào thời gian nào?", ["1930 - 1945", "1945 - 1975", "1858 - 1930", "1946 - 1954"], 3], ["Hội nghị toàn xứ Đảng bộ Nam Kỳ (ngày 25/10/1945) được tổ chức tại đâu?", ["Dinh Độc lập (Sài Gòn)", "Cái Bè (Mỹ Tho)", "Năm Căn (Cà Mau)", "Rạch Giá (Kiên Giang)"], 1], ["Hội nghị toàn xứ Đảng bộ Nam Kỳ (ngày 25/10/1945) đã quyết định:", ["Đưa cách mạng Việt Nam rút lui vào hoạt động bí mật", "Tạm thời giải tán các tổ chức Đảng", "Tiếp tục hòa hoãn, kéo dài thời gian với Pháp để xây dựng lực lượng", "Củng cố lực lượng, kiên quyết đẩy lùi cuộc tấn công của quân Pháp"], 3], ["“Thành đồng Tổ quốc” là danh hiệu Chủ tịch Hồ Chí Minh tặng nhân dân vùng nào?", ["Bắc Bộ", "Trung Bộ", "Nam Bộ", "Tây Nguyên"], 2], ["Để làm thất bại âm mưu “Diệt Cộng, cầm Hồ, phá Việt Minh” của quân Tưởng và tay sai, Đảng và Chính phủ ta đã thực hiện sách lược:", ["Ký nhiều hòa ước có lợi cho quân Nhật", "Tiến hành các cuộc xung đột vũ trang với quân Tưởng", "Đưa ra nhiều yêu sách đòi quân Tưởng phải rút quân khỏi Việt Nam", "Triệt để lợi dụng mâu thuẫn kẻ thù, hòa hoãn, nhân nhượng có nguyên tắc với quân Tưởng"], 3], ["Đâu là chính sách được Đảng và Chủ tịch Hồ Chí Minh dùng để đối phó với quân Tưởng?", ["Giao thiệp thân thiện, ứng xử mềm dẻo, linh hoạt với yêu sách của quân Tưởng và tay sai", "Mời Tưởng Giới Thạch làm chủ tịch Quốc hội nước Việt Nam Dân chủ Cộng hoà", "Liên minh với quân đội Pháp để đuổi quân Tưởng về nước", "Giao chính phủ cho quân đội của Tưởng, Đảng rút lui vào hoạt động bí mật"], 0], ["Ngày 11/11/1945, Đảng chủ trương rút vào hoạt động bí mật bằng thông cáo tự giải tán, mục đích là để:", ["Đảng từ bỏ quyền lãnh đạo cách mạng Việt Nam", "Giao lại quyền lãnh đạo Đảng cho thực dân Pháp", "Tránh mũi nhọn tấn công của Pháp và Tưởng", "Thừa nhận sự cai trị hợp pháp của quân đội Tưởng ở Việt Nam"], 2], ["Đảng chủ trương rút vào hoạt động bí mật năm 1945, chỉ để lại một bộ phận hoạt động công khai với danh nghĩa là:", ["Hội nghiên cứu văn hóa Đông Dương", "Hội nghiên cứu chủ nghĩa Mác ở Đông Dương", "Hội nhà báo Đông Dương", "Hội những người yêu thiên nhiên Đông Dương"], 1], ["Khẩu hiệu được nhân dân các tỉnh Nam Bộ dùng để nâng cao tinh thần chiến đấu trong những ngày đầu chống thực dân Pháp xâm lược lần thứ hai là:", ["Thà chết tự do còn hơn sống nô lệ", "Quyết tử để Tổ quốc quyết sinh", "Thóc không thiếu một cân, quân không thiếu một người", "Vững tay súng, chắc tay cày"], 0], ["Để hạn chế sự chống phá của các tổ chức chính trị tay sai thân Tưởng là Việt Quốc, Việt Cách, Đảng đã thực hiện chủ trương nào dưới đây?", ["Đồng ý bổ sung thêm 70 ghế trong Quốc hội cho các tổ chức này không qua bầu cử", "Điều động các đơn vị lực lượng vũ trang bao vây các tổ chức này, buộc rút quân về nước", "Cung cấp thuốc men, đạn dược và nhu yếu phẩm theo yêu cầu của các tổ chức này", "Chấp nhận bỏ sử dụng đồng bạc Đông Dương, chuyển hoàn toàn sang sử dụng đồng tiền Quan kim, Quốc tệ"], 0], ["Hiệp ước Trùng Khánh (Hiệp ước Hoa - Pháp) đã được ký kết vào năm nào?", ["1930", "1946", "1954", "1975"], 1], ["Bản chất của Hiệp ước Hoa - Pháp (28/2/1946) đã chà đạp lên nền độc lập của Việt Nam và hợp pháp hoá hành động xâm lược của:", ["Thực dân Pháp", "Quân đội Trung Quốc", "Quân đội Nhật Bản", "Đế quốc Mỹ"], 0], ["Đảng chủ trương hòa hoãn với Pháp nhằm:", ["Tiêu diệt giặc nội xâm, phát triển kinh tế", "Có thời gian tìm các liên minh quân sự để đối phó với Pháp", "Tiêu diệt tay sai, thúc đẩy nhanh quân Tưởng về nước", "Lôi kéo sự ủng hộ của chính phủ Pháp"], 2], ["Ngày 6/3/1946, Chủ tịch Hồ Chí Minh đã ký với Pháp văn bản nào?", ["Tạm ước", "Tạm ước sơ bộ", "Hiệp ước sơ bộ", "Hiệp định sơ bộ"], 3], ["Hiệp ước Hoa - Pháp được ký kết ngày 28/2/1946 đã đẩy cách mạng Việt Nam vào tình thế:", ["Cùng lúc đối mặt trực tiếp với hai kẻ thù lớn là Pháp và Tưởng", "Chính phủ phải giao lại Quốc hội cho quân Tưởng", "Quốc hội có nguy cơ giải tán", "Nạn đói có thể bùng phát trở lại"], 0], ["Một trong những nội dung của bản Hiệp định Sơ bộ được Hồ Chí Minh ký kết với Pháp ngày 6/3/1946 là:", ["Thực dân Pháp có toàn quyền khai thác các mỏ khoáng sản ở Việt Nam trong thời hạn 30 năm", "Việt Nam đồng ý cho quân đội Pháp đóng quân ở các khu vực quân sự trọng điểm", "Quân Pháp phải rút quân dần ra khỏi Việt Nam trong thời hạn 5 năm", "Việt Nam sẽ cung cấp lương thực, thuốc men và vũ khí cho quân đội Pháp để đánh Tưởng"], 2], ["Bản Hiệp định Sơ bộ được ký ngày 6/3/1946 có ý nghĩa to lớn với cách mạng Việt Nam bởi vì sẽ giúp chúng ta có thêm thời gian:", ["Chuẩn bị lực lượng mọi mặt cho cuộc kháng chiến với Pháp", "Xây dựng chủ nghĩa xã hội", "Khai hoang các vùng đất phía Nam", "Tổ chức bầu cử"], 0], ["Chủ trương hoà hoãn, nhân nhượng với Pháp để kéo dài thời gian hoà bình xây dựng đất nước được thể hiện rõ trong bản Chỉ thị nào dưới đây?", ["Kháng chiến kiến quốc", "Hoà để tiến", "Nhật - Pháp bắn nhau và hành động của chúng ta", "Toàn dân kháng chiến"], 1], ["Nguyên nhân sâu xa nào dẫn đến sự kiện Toàn quốc kháng chiến vào cuối năm 1946 của cách mạng Việt Nam?", ["Việt Nam đã có lực lượng hải quân và không quân đủ mạnh để chống Pháp", "Quân Pháp ở Việt Nam liên tục bội ước với mong muốn dâng nước ta cho Nhật", "Quân Pháp ở Việt Nam đình chiến, kéo dài thời gian rút quân khỏi Việt Nam", "Quân Pháp ở Việt Nam bộc lộ rõ thái độ bội ước, quyết tâm muốn xâm lược nước ta một lần nữa"], 3], ["Tại Hà Nội, cuộc kháng chiến toàn quốc bắt đầu bằng sự kiện nào?", ["Loạt đại bác bắn vào thành Hà Nội từ pháo đài Láng", "Pháp đơn phương tuyên bố cắt đứt liên hệ với Chính phủ Việt Nam", "Hồ Chí Minh ra lời kêu gọi Toàn quốc kháng chiến", "Quân Pháp tấn công vào Đại Nội Huế"], 0], ["Cuộc kháng chiến toàn quốc tại mặt trận Hà Nội (1946) kéo dài trong bao nhiêu ngày đêm?", ["54 ngày đêm", "60 ngày đêm", "72 ngày đêm", "80 ngày đêm"], 1], ["Đâu là phương châm kháng chiến được Đảng đề ra trong cuộc kháng chiến chống Pháp, giai đoạn 1945 - 1947?", ["Dựa trên sức mạnh toàn dân, tiến hành kháng chiến đánh nhanh, thắng nhanh", "Chiến đấu cầm chừng, tiến hành kháng chiến đánh chắc, tiến chắc", "Dựa trên sức mạnh toàn dân, tiến hành kháng chiến toàn dân, toàn diện, lâu dài và dựa vào sức mình là chính", "Chiến đấu cầm chừng, tranh thủ thời gian xây dựng và phát triển kinh tế"], 2], ["Tác phẩm “Kháng chiến nhất định thắng lợi” là do ai viết?", ["Hồ Chí Minh", "Phạm Văn Đồng", "Võ Nguyên Giáp", "Trường Chinh"], 3], ["Tính đến năm 1950, những nhà nước nào đã công nhận và đặt quan hệ ngoại giao với Nhà nước Việt Nam Dân chủ Cộng hoà?", ["Trung Quốc, Liên Xô, Lào, Triều Tiên", "Trung Quốc, Liên Xô, các nước Đông Âu, Triều Tiên", "Trung Quốc, Liên Xô, Lào, Campuchia", "Trung Quốc, Liên Xô, các nước Đông Âu, Lào"], 1], ["Một trong những mục đích của Trung ương Đảng khi chủ động mở Chiến dịch Biên giới Thu Đông 1950 là:", ["Mở rộng căn cứ địa Việt Bắc", "Khai thông biên giới Việt Nam - Lào - Campuchia", "Ngăn chặn sự tiếp viện của Mỹ cho quân đội Pháp", "Để giành thắng lợi quan trọng nhằm kết thúc chiến tranh với Pháp"], 0], ["Trong Sắc lệnh về nghĩa vụ quân sự được Hồ Chí Minh ký ban hành tháng 11/1949 đã đề cập đến việc ưu tiên phát triển lực lượng ba thứ quân. Ba thứ quân đó gồm:", ["Bộ đội chủ lực, bộ đội địa phương, dân quân du kích", "Bộ đội chủ lực, bộ đội địa phương, thanh niên xung phong", "Thanh niên xung phong, bộ đội địa phương, dân quân du kích", "Thanh niên xung phong, bộ đội chủ lực, dân quân du kích"], 0], ["Chiến thắng trong Chiến dịch Biên giới Thu Đông năm 1950 có ý nghĩa lớn với cách mạng Việt Nam bởi vì:", ["Kết thúc thời kì chiến đấu trong vòng vây", "Pháp phải trao trả lại các vùng tạm chiếm cho quân đội Việt Nam", "Đóng cửa hoàn toàn biên giới Việt Trung", "Việt Nam được giải phóng hoàn toàn"], 0], ["Đại hội đại biểu toàn quốc lần thứ II của Đảng (2/1951) đã diễn ra ở đâu?", ["Chiêm Hoá (Tuyên Quang)", "Võ Nhai (Thái Nguyên)", "Bắc Sơn (Lạng Sơn)", "Pác Bó (Cao Bằng)"], 0], ["Đại hội đại biểu toàn quốc lần thứ II của Đảng (2/1951) đã quyết định việc Đảng ra hoạt động công khai và lấy tên là:", ["Đảng Cộng sản Việt Nam", "Đảng Cộng sản Đông Dương", "Đảng Lao động Việt Nam", "Đông Dương Cộng sản Đảng"], 2], ["Từ cuối năm 1950, Đảng quyết định tạm thời ngừng phát triển Đảng bởi vì:", ["Ở nhiều nơi, việc phát triển Đảng quá nhanh dẫn đến việc mắc sai lầm về tiêu chuẩn Đảng viên", "Đảng muốn tập trung sức lực cho cuộc kháng chiến chống Pháp", "Các Đảng viên tập trung vào làm kinh tế tư nhân, lơ là với nhiệm vụ cách mạng", "Số lượng Đảng viên đã đủ"], 0], ["Chiến dịch nào đã được Đảng phát động từ năm 1951?", ["Chiến dịch Tây Bắc Thu Đông", "Chiến dịch Hoà Bình", "Chiến dịch Thượng Lào", "Chiến dịch Nam Lào"], 1], ["Động lực của cách mạng Việt Nam được xác định trong Đại hội đại biểu toàn quốc lần thứ II của Đảng (2/1951) gồm các giai cấp và tầng lớp nào?", ["Công nhân, nông dân, tiểu tư sản và tư sản mại bản", "Phong kiến, nông dân, công nhân và tư sản dân tộc", "Công nhân, nông dân, tiểu tư sản và tư sản dân tộc", "Phong kiến, nông dân, tư sản dân tộc và tư sản mại bản"], 2], ["Đâu là mặt hạn chế của cuộc cải cách ruộng đất (1957) do Đảng phát động?", ["Chia ruộng đất chưa đồng đều cho người nông dân", "Độc đoán, quan liêu, gây ra oan sai không đáng có", "Gây cản trở trong việc nâng cao năng suất cây trồng, vật nuôi", "Không chia lại ruộng đất cho các gia đình bần, cố nông"], 1], ["Tính chất của xã hội Việt Nam được xác định trong Đại hội đại biểu toàn quốc lần thứ II của Đảng (2/1951) là:", ["Dân chủ nhân dân, một phần thuộc địa và nửa phong kiến", "Cộng sản chủ nghĩa, nửa phong kiến", "Nửa phong kiến, nửa tư bản", "Thuộc địa kiểu mới, nửa xã hội chủ nghĩa"], 0], ["Thực dân Pháp dưới sự hỗ trợ tài chính của Mỹ, đã xây dựng Điện Biên Phủ trở thành một căn cứ quân sự khổng lồ và được giới quân sự, chính trị thế giới ca ngợi là một:", ["Pháo đài không thể công phá", "Cỗ máy không thể công phá", "Trận địa thép không thể công phá", "Căn cứ không thể công phá"], 0], ["Ai đã được Bộ Chính trị giao chức vụ Tư lệnh kiêm Bí thư Đảng uỷ chiến dịch Điện Biên Phủ?", ["Hồ Chí Minh", "Nguyễn Chí Thanh", "Nguyễn Vịnh", "Võ Nguyên Giáp"], 3], ["Chủ tịch Hồ Chí Minh đã nói: “Chiến dịch này là một chiến dịch rất quan trọng, không những về quân sự mà cả về chính trị, không những đối với trong nước mà đối với quốc tế. Vì vậy, toàn quân, toàn dân, toàn Đảng phải tập trung hoàn thành cho kỳ được”. Chiến dịch được Hồ Chí Minh nhắc đến trong câu nói trên là:", ["Chiến dịch Hoàng Hoa Thám", "Chiến dịch Việt Bắc - Thu Đông 1947", "Chiến dịch Hồ Chí Minh", "Chiến dịch Điện Biên Phủ"], 3], ["Phương châm kháng chiến của quân đội Việt Minh trong chiến dịch Điện Biên Phủ là:", ["Đánh chắc, tiến chắc", "Thần tốc, bất ngờ", "Táo bạo, thần tốc", "Táo bạo, chắc thắng"], 0], ["Trận Điện Biên Phủ (7/1954) thắng lợi đã mang lại ý nghĩa rất lớn không chỉ đối với cách mạng Việt Nam, mà còn cả đối với cách mạng thế giới vì:", ["Báo hiệu sự thắng lợi của nhân dân các dân tộc bị áp bức, sự sụp đổ của chủ nghĩa thực dân", "Báo hiệu sự sụp đổ không thể tránh khỏi của chủ nghĩa tư bản", "Làm sụp đổ hệ thống phát-xít ở các nước châu Âu", "Giúp các quốc gia tư bản ở Châu Á - Âu - Mỹ Latinh tự giải phóng cho mình"], 0], ["Một trong những ý nghĩa quan trọng của Hiệp định Giơ-ne-vơ (21/7/1954) đối với cách mạng Việt Nam là:", ["Đánh dấu mốc cuộc kháng chiến chống Pháp kết thúc thắng lợi, miền Bắc được hoàn toàn giải phóng", "Đánh dấu mốc cuộc kháng chiến chống Pháp kết thúc thắng lợi, miền Nam được hoàn toàn giải phóng", "Đánh dấu mốc cuộc kháng chiến chống Mỹ kết thúc thắng lợi, nước ta hoàn toàn được giải phóng", "Đánh dấu mốc cuộc kháng chiến chống Pháp bước sang một giai đoạn mới, non sông thu về một mối, cả nước bước vào thời kỳ quá độ"], 0], ["Bản Hiệp định đình chỉ chiến sự ở Việt Nam (Hiệp định Giơ-ne-vơ) đã được các bên đồng ý kí kết vào thời gian nào?", ["27/1/1954", "21/7/1954", "21/1/1954", "27/7/1954"], 1], ["Sau ngày Hiệp định Giơ-ne-vơ được ký kết (7/1954), cách mạng miền Bắc có đặc điểm là:", ["Trở thành thuộc địa kiểu mới của đế quốc Mỹ", "Được hoàn toàn giải phóng, phát triển theo con đường xã hội chủ nghĩa", "Bị thực dân Pháp tái chiếm", "Nằm dưới sự kiểm soát của chính quyền Ngô Đình Diệm"], 1], ["Yếu tố nào dưới đây được xem như là kinh nghiệm của Đảng trong lãnh đạo kháng chiến chống Pháp và can thiệp Mỹ giai đoạn 1945 - 1954?", ["Kết hợp chặt chẽ và giải quyết đúng đắn mối quan hệ giữ hai nhiệm vụ cơ bản vừa kháng chiến vừa kiến quốc", "Tập trung toàn bộ sức lực của toàn Đảng, toàn dân vào xây dựng và phát triển lực lượng vũ trang", "Có những sách lược ngoại giao khôn khéo để tranh thủ sự ủng hộ của các nước xã hội chủ nghĩa anh em", "Đề ra được phương châm xuyên suốt trong cuộc kháng chiến là lối đánh nhanh, thắng nhanh"], 0], ["Trong giai đoạn 1954 - 1965, Đảng đã gặp khó khăn gì trong lãnh đạo cách mạng ở hai miền Nam Bắc?", ["Thực dân Pháp vẫn chưa chịu rút quân về nước", "Đế quốc Mỹ mang quân ra miền Bắc Việt Nam", "Cục diện Chiến tranh lạnh trên thế giới diễn ra rất căng thẳng", "Đất nước ta bị chia làm hai miền với hai chế độ khác biệt"], 3], ["Nguyên nhân nào dưới đây được xem là nguyên nhân gây ra một số sai lầm trong cải cách ruộng đất ở miền Bắc?", ["Do chủ quan, giáo điều, không xuất phát từ tình hình thực tiễn ở nông thôn miền Bắc sau ngày giải phóng", "Do không có sự chuẩn bị kĩ lưỡng trước khi tiến hành cải cách", "Do có sự chống đối quyết liệt từ người dân, đặc biệt là nông dân", "Do miền Bắc còn nhiều ruộng đất bỏ hoang, vô chủ"], 0], ["Một trong những kết quả nổi bật trong phát triển kinh tế - văn hoá và cải tạo xã hội chủ nghĩa ở miền Bắc trong ba năm (1958 - 1960) là:", ["Miền Bắc có nền kinh tế tư bản phát triển cao, đời sống người dân được cải thiện rõ nét", "Miền Bắc từng bước đi lên chủ nghĩa xã hội và trở thành hậu phương ổn định của tiền tuyến miền Nam", "Nạn đói được đẩy lùi, người dân tự tổ chức những đợt di cư vào miền Nam", "Miền Bắc đã xây dựng được những cơ sở sản xuất vũ khí hiện đại, đáp ứng đủ cho nhu cầu của miền Nam"], 1], ["Bản dự thảo “Đề cương cách mạng miền Nam”do đồng chíLê Duẩn soạn thảo vào tháng 8/1956 được xem là một trong những văn kiện quan trọng bởi vì:", ["Góp phần hình thành đường lối cách mạng ở miền Nam của Đảng", "Giúp cách mạng miền Nam chuyển từ thế phòng ngự sang tiến công", "Khích lệ tinh thần những người cộng sản đang bị giam giữ, tù đày", "Cổ vũ người dân miền Nam đứng lên lật đổ chính quyền Ngô Đình Diệm"], 0], ["Điền cụm từ còn thiếu vào chỗ trống: Hội nghị lần thứ 6 Ban Chấp hành Trung ương Đảng (từ ngày 15 đến 17/7/1954) đã chỉ rõ: “Hiện nay …… là kẻ thù chính của nhân dân thế giới, và nó đang trở thành kẻ thù chính và trực tiếp của nhân dân Đông Dương, cho nên mọi việc của ta đều nhằm chống ……”", ["Phát-xít", "Thực dân Pháp", "Đế quốc Mỹ", "Chủ nghĩa tư bản"], 2], ["Nghị quyết Bộ Chính trị tháng 9/1954 đã đề ra nhiệm vụ cụ thể, trước mắt cho cách mạng miền Nam là:", ["Bằng mọi cách yêu cầu quân đội Pháp rút hết quân về nước", "Giúp miền Bắc xây dựng chủ nghĩa xã hội nhanh, mạnh, vững chắc", "Tập hợp mọi lực lượng đấu tranh nhằm lật đổ chính quyền bù nhìn thân Mỹ, hoàn thành thống nhất Tổ quốc", "Đề ra kế hoạch phát triển kinh tế miền Nam theo hướng tư bản chủ nghĩa"], 2], ["Tháng 3/1959, chính quyền Ngô Đình Diệm đã:", ["Thông qua luật 10/59, đặt những người cộng sản ra khỏi vòng pháp luật", "Tuyên bố đặt miền Nam trong tình trạng chiến tranh", "Mang quân ra xâm lược miền Bắc Việt Nam", "Tự giải tán, đưa Ngô Đình Nhu lên cầm quyền"], 1], ["Ngày 6/5/1959 chính quyền tay sai Ngô Đình Diệm đã ký ban hành Luật 10/59 nhằm mục đích:", ["Dùng toà án quân sự đặc biệt để đưa những người bị bắt ra xét xử và bắn giết tại chỗ", "Gây sức ép với Chính phủ Mỹ tăng viện trợ cho cuộc chiến ở miền Nam Việt Nam", "Hợp pháp hoá việc mang quân ra miền Bắc Việt Nam", "Chuẩn bị cho một cuộc đảo chính nhằm hất cẳng quân đội Mỹ ra khỏi miền Nam"], 0], ["Dưới tác động của các chính sách khủng bố của chính quyền tay sai Ngô Đình Diệm, Hội nghị Trung ương lần thứ 15 của Đảng (1/1959) đã ra nghị quyết về cách mạng miền Nam với tinh thần cơ bản là:", ["Tiếp tục cuộc cách mạng dân tộc dân chủ nhân dân", "Tạm thời dừng cuộc cách mạng dân tộc dân chủ nhân dân", "Tiến hành các cuộc bạo động để giành lại chính quyền", "Dừng sử dụng bạo lực cách mạng, chuyển hướng sang đấu tranh trên mặt trận ngoại giao"], 0], ["Hình thức “Đồng Khởi” của nhân dân miền Nam (1960) lần đầu tiên diễn ra ở tỉnh:", ["Cà Mau", "Tiền Giang", "Cần Thơ", "Bến Tre"], 3], ["Một trong những thủ đoạn được chính quyền tay sai Ngô Đình Diệm sử dụng để thi hành chính sách thực dân mới của Mỹ ở miền Nam Việt Nam là:", ["Tăng cường thực hiện chính sách“tố cộng, diệt cộng”", "Lập ra chính quyền tự quản", "Giải tán các ấp chiến lược", "Giải tán các khu trù mật, khu dinh điền"], 0], ["Mặt trận Dân tộc giải phóng miền Nam Việt Nam được thành lập ngày 20/12/1960 có ý nghĩa như là:", ["Một tổ chức chính trị để tập hợp rộng rãi quần chúng nhân dân đoàn kết đấu tranh chống lại chính quyền độc tài của Ngô Đình Diệm", "Một tổ chức vũ trang với nhiệm vụ huấn luyện, đào tạo quân đội Việt Minh", "Một tổ chức xã hội với nhiệm vụ chăm lo đời sống cho con em những người cộng sản", "Một tổ chức ngoại giao với nhiệm vụ kêu gọi sự ủng hộ của những người yêu chuộng hoà bình thế giới đối với cuộc kháng chiến chống Mỹ của nhân dân ta"], 0], ["Phong trào nào dưới đây đã được phát triển mạnh và nhận được sự ủng hộ của hàng triệu người dân miền Nam trong giai đoạn đầu của cuộc kháng chiến chống Mỹ?", ["Đấu tranh đòi hiệp thương tổng tuyển cử", "Di dân ra miền Bắc Việt Nam", "Dồn dân, lập ấp", "Đưa cộng sản ra ngoài vòng pháp luật"], 0], ["Thắng lợi của phong trào Đồng khởi (1960) có ý nghĩa như thế nào đối với cách mạng miền Nam?", ["Khiến cho Mỹ phải xuống thang chiến tranh ở miền Nam", "Khiến cho Mỹ phải rút quân ra khỏi miền Nam Việt Nam", "Chuyển cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công", "Chuyển cách mạng miền Nam sang lối đánh thần tốc, táo bạo"], 2], ["Đại hội đại biểu toàn quốc lần thứ III (9/1960) của Đảng họp ở đâu?", ["Tuyên Quang", "Hà Giang", "Bắc Ninh", "Hà Nội"], 3], ["Chủ đề của Đại hội đại biểu toàn quốc lần thứ III của Đảng (9/1960) là:", ["Xây dựng chủ nghĩa xã hội ở miền Bắc và đấu tranh hoà bình thống nhất nước nhà", "Cả nước bước vào thời kỳ quá độ, bỏ qua giai đoạn tư bản chủ nghĩa", "Phát huy sức mạnh toàn dân tộc, đẩy mạnh công nghiệp hoá - hiện đại hoá", "Nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, sớm đưa nước ta ra khỏi tình trạng kém phát triển"], 0], ["Đại Hội III của Đảng (9/1960) đã xác định nhiệm vụ của cách mạng Việt Nam trong giai đoạn mới là:", ["Thực hiện cách mạng xã hội chủ nghĩa ở miền Bắc, cách mạng dân tộc dân chủ nhân dân ở miền Nam", "Làm nghĩa vụ quốc tế ở khu vực Đông Nam Á", "Xoá bỏ những tàn tích phong kiến và nửa phong kiến làm cho người cày có ruộng", "Phát triển chế độ dân chủ nhân dân, gây dựng cơ sở cho chủ nghĩa xã hội"], 0], ["Đặc điểm nào dưới đây được Đại hội III của Đảng (9/1960) xem như là nổi bật nhất trong quá trình xây dựng chủ nghĩa xã hội ở miền Bắc thời kỳ 1961 - 1965?", ["Từ một nền kinh tế nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội, bỏ qua giai đoạn tư bản chủ nghĩa", "Từ một nền kinh tế nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa tư bản", "Từ một nền kinh tế nông nghiệp lạc hậu, tiến hành công nghiệp hoá trên quy mô toàn miền", "Từ một nền kinh tế nông nghiệp lạc hậu chuyển sang xây dựng một nền kinh tế thương mại đa ngành"], 0], ["Thành công to lớn nhất của Đại hội lần thứ III của Đảng (9/1960) là:", ["Hoàn chỉnh đường lối chiến lược chung của cách mạng Việt Nam trong giai đoạn mới", "Đã lập ra nhà nước Việt Nam Dân chủ Cộng hoà", "Lần đầu tiên Đảng đề ra bản Hiến pháp", "Chuyển từ nền kinh tế quan liêu, bao cấp sang hạch toán kinh tế"], 0], ["Kế hoạch 5 năm lần thứ nhất được Đại hội III của Đảng (9/1960) đề ra cho cách mạng miền Bắc được thực hiện vào thời gian nào?", ["1956 - 1960", "1961 - 1965", "1966 - 1970", "1971 - 1975"], 1], ["“Tàu không số” là khái niệm dùng để chỉ:", ["Những con tàu vận chuyển hàng hoá trái phép trong thời kì kháng chiến chống Mỹ", "Những con tàu do Liên Xô viện trợ để giúp Việt Nam chống Mỹ", "Những con tàu bí mật chở vũ khí, hàng hoá từ miền Bắc vào chi viện cho miền Nam chống Mỹ", "Những con tàu gián điệp Mỹ dùng để xâm nhập các cơ sở cách mạng bí mật ở miền Nam Việt Nam"], 2], ["Chiến lược “Chiến tranh đặc biệt” của đế quốc Mỹ ở miền Nam đã diễn ra trong thời gian nào?", ["1961 - 1965", "1960 - 1965", "1965 - 1971", "1971 - 1975"], 0], ["Chiến thuật quân sự “trực thăng vận” và “thiết xa vận” được Mỹ áp dụng trong chiến lược chiến tranh nào ở miền Nam Việt Nam?", ["Chiến tranh đơn phương", "Chiến tranh cục bộ", "Chiến tranh đặc biệt", "Việt Nam hoá chiến tranh"], 2], ["Một trong những kết quả miền Bắc đạt được sau 10 năm thực hiện khôi phục, cải tạo và xây dựng chế độ mới (1954 - 1964) là:", ["Trở thành hậu phương vững chắc, đủ sức cung cấp nhân lực, tài lực, vật lực cho tiền tuyến miền Nam", "Trở thành thị trường xuất khẩu lúa gạo lớn nhất ở Đông Nam Á", "Xây dựng được một nền công nghiệp hiện đại với cơ cấu đa ngành", "Hoàn thành giai đoạn quá độ lên chủ nghĩa xã hội, chính thức bước vào xã hội cộng sản"], 0], ["Ngày 15/2/1961, các lực lượng vũ trang ở miền Nam được thống nhất với tên gọi mới là:", ["Đội giải phóng miền Nam Việt Nam", "Hội giải phóng miền Nam Việt Nam", "Quân giải phóng miền Nam Việt Nam", "Cục giải phóng miền Nam Việt Nam"], 2], ["“Thóc không thiếu một cân, quân không thiếu một người” là khẩu hiệu dùng để chỉ:", ["Sự chi viện nhiệt tình của hậu phương miền Bắc cho tiền tuyến miền Nam trong cuộc kháng chiến chống Mỹ", "Sự tự cung tự cấp trong đời sống hàng ngày của người dân miền Bắc", "Sự phát triển về các mặt kinh tế, quân sự của miền Bắc", "Sự gian khổ trong đời sống của người dân miền Bắc trong những ngày chiến tranh phá hoại của đế quốc Mỹ"], 0], ["Tháng 12/1967, Bộ Chính trị đã ra một nghị quyết lịch sử, chuyển cuộc chiến tranh cách mạng miền Nam sang thời kỳ mới, thời kỳ tiến lên giành thắng lợi quyết định bằng phương pháp:", ["Mít-tinh, biểu tình", "Tổng công kích, tổng khởi nghĩa", "Đàm phán ngoại giao với chính Phủ Mỹ", "Khởi nghĩa từng phần"], 1], ["Cuộc tập kích chiến lược bằng máy bay B52 của Mỹ vào Hà Nội, Hải Phòng và một số tỉnh ở miền Bắc cuối năm 1972 đã diễn ra trong bao nhiêu ngày đêm?", ["10 ngày đêm", "12 ngày đêm", "15 ngày đêm", "30 ngày đêm"], 1], ["Sau thất bại của chiến lược “Chiến tranh cục bộ”, Mỹ đã dùng chiến lược nào thay thế để tiếp tục cuộc chiến tranh xâm lược thực dân mới của Mỹ ở miền Nam?", ["Chiến tranh đơn phương", "Chiến tranh đặc biệt", "Chiến tranh cục bộ", "Việt Nam hoá chiến tranh"], 3], ["Đâu là điểm nổi bật của chiến lược Việt Nam hoá chiến tranh mà Mỹ thực hiện ở miền Nam Việt Nam (1969 - 1973)?", ["Sử dụng lính đánh thuê từ Úc và Thái Lan", "Sử dụng hoàn toàn quân lính Mỹ", "Dùng người Việt Nam đánh người Việt Nam", "Sử dụng quân tình nguyện quốc tế"], 2], ["Điền từ thích hợp vào chỗ trống để hoàn thành đoạn thơ chúc tết năm 1969 của Chủ tịch Hồ Chí Minh: “Năm qua thắng lợi vẻ vang Năm nay tiền tuyến chắc càng thắng to Vì độc lập, vì tự do Đánh cho …… cút, đánh cho …… nhào.”", ["Mỹ - Ngụy", "Mỹ - Mỹ", "Giặc a Đảng trong cuộc kháng chiến chống Mỹ cứu nước giai đoạn 1954 - 1975?", ["Giải quyết hài hoà nhiệm vụ của hai miền Nam Bắc trong bối cảnh nước ta bị chia cắt làm hai miền", "Luôn luôn duy trì lối đánh táo bạo, thần tốc, bất ngờ", "Đảng phải huy động mọi tầng lớp, giai cấp tham gia vào mặt trận quân sự", "Kiên trì mục tiêu giải phóng miền Nam trong trước năm 1975 trong mọi tình huống"], 0], ["Ý nghĩa to lớn nhất về sự thắng lợi của cuộc kháng chiến chống Mỹ cứu nước (1954 - 1975) đối với cách mạng Việt Nam là:", ["Giành lại nền độc lập, thống nhất, toàn vẹn lãnh thổ cho đất nước", "Đưa miền Nam Việt Nam trở thành khu đô thị kinh tế mới", "Vị thế của Việt Nam trong khối ASEAN được nâng cao rõ rệt", "Buộc Mỹ phải bồi thường chiến tranh cho Việt Nam"], 0], ["Nguyên nhân mang tính quyết định tới sự thắng lợi của cuộc kháng chiến chống Mỹ cứu nước của nhân dân ta (1954 - 1975) là:", ["Sự trợ giúp, hy sinh quên mình của hậu phương lớn miền Bắc xã hội chủ nghĩa", "Sự ủng hộ của các nước xã hội chủ nghĩa, đặc biệt là Liên Xô", "Sự ủng hộ của các lực lượng yêu chuộng hoà bình trên thế giới", "Sự ủng hộ của người dân Mỹ"], 0], ["Điền cụm từ còn thiếu vào chỗ trống: “Năm tháng sẽ trôi qua nhưng thắng lợi của nhân dân ta trong sự nghiệp kháng chiến chống Mỹ cứu nước mãi mãi được ghi vào lịch sử dân tộc ta như một trong những trang chói lọi nhất, một biểu tượng sáng ngời về sự toàn thắng của …… và trí tuệ con người và đi vào lịch sử thế giới như một chiến công vĩ đại của thế kỉ XX, một sự kiện có tầm quan trọng quốc tế to lớn và có tính thời đại sâu sắc.” (Trích Bài diễn văn tại lễ khai mạc Đại hội IV của Đảng)", ["Chủ nghĩa xã hội chân chính", "Chủ nghĩa nhân đạo", "Chủ nghĩa anh hùng cách mạng", "Chủ nghĩa dân tộc nhược tiểu"], 2], ["Hoàn cảnh lịch sử nổi bật của đất nước ta sau năm 1975 là:", ["Đã có hoà bình, độc lập, thống nhất, cả nước quá độ lên chủ nghĩa xã hội", "Bị chia cắt làm hai miền, miền Bắc đi lên chủ nghĩa xã hội", "Bị các nước trong khối xã hội chủ nghĩa bao vây, cấm vận", "Đã cơ bản trở thành một nước công nghiệp theo hướng hiện đại"], 0], ["Một trong những hoạt động cấp bách của cách mạng Việt Nam phải được xúc tiến ngay sau cuộc kháng chiến chống Mỹ kết thúc thắng lợi là:", ["Yêu cầu chính phủ Mỹ bồi thường chiến phí cho nhân dân Việt Nam", "Tìm công ăn việc làm cho các Cựu chiến binh đã tham gia cuộc kháng chiến chống Mỹ", "Hoàn thành việc thống nhất đất nước về mặt nhà nước", "Điều quân tình nguyện Việt Nam sang giúp Campuchia đối phó với nạn diệt chủng"], 2], ["Để hoàn thành chủ trương thống nhất đất nước về mặt nhà nước, cách mạng miền Nam phải:", ["Đồng thời tiến hành cải tạo xã hội chủ nghĩa và xây dựng chủ nghĩa xã hội", "Thiết lập các cấp chính quyền theo chế độ phong kiến", "Hoàn thiện quan hệ tư bản chủ nghĩa tiến tới xây dựng chủ nghĩa cộng sản", "Bỏ qua giai đoạn cải tạo xã hội chủ nghĩa, tiến thẳng lên quá trình xây dựng chủ nghĩa xã hội"], 0], ["Thành phố Sài Gòn được đổi tên là Thành phố Hồ Chí Minh vào năm nào?", ["Năm 1945", "Năm 1954", "Năm 1976", "Năm 1990"], 2], ["Vì sao việc thống nhất đất nước về mặt nhà nước lại cần phải được xúc tiến một cách khẩn trương, càng sớm càng tốt?", ["Để mau chóng phát huy toàn bộ sức mạnh mới của đất nước", "Để Đảng và Chính phủ tăng thêm quyền lực", "Để nhận được sự viện trợ từ các nước xã hội chủ nghĩa", "Để thúc đẩy quá trình Việt Nam gia nhập vào Tổ chức Thương mại thế giới"], 0], ["Quốc hội đã quyết định đặt tên nước ta là nước Cộng hoà xã hội chủ nghĩa Việt Nam vào năm:", ["1976", "1980", "1985", "1990"], 0], ["Ai là tác giả của bài hát “Tiến quân ca”?", ["Phan Huỳnh Điểu", "Văn Cao", "Đinh Nhu", "Nguyễn Đình Thi"], 1], ["Đại hội IV của Đảng (12/1976) đã nêu ra đặc điểm nổi bật của cách mạng Việt Nam trong giai đoạn mới là:", ["Nước ta đang trong quá trình phát triển kinh tế một cách bền vững, đa nghề, đa ngành", "Nước ta đang trong quá trình từ sản xuất nhỏ tiến thẳng lên chủ nghĩa xã hội, bỏ qua giai đoạn phát triển tư bản chủ nghĩa", "Nước ta đang trong quá trình hoàn thành giai đoạn quá độ, chuẩn bị tiến lên chủ nghĩa xã hội", "Nước ta đã hoàn thành giai đoạn xây dựng chủ nghĩa xã hội, chuẩn bị tiến lên xã hội Cộng sản"], 1], ["Điền từ thích hợp vào chỗ trống: Đại hội IV của Đảng đã xác định đường lối chung của cách mạng xã hội chủ nghĩa trong giai đoạn mới là: “Nắm vững ……, phát huy quyền làm chủ của nhân dân và tiến hành đồng thời ba cuộc cách mạng: cách mạng về quan hệ sản xuất, cách mạng khoa học - kỹ thuật và cách mạng tư tưởng, văn hoá.”", ["Quyền lực nhà nước", "Chuyên chính vô sản", "Ngọn cờ độc lập", "Tài chính quốc gia"], 1], ["Vào thập niên 70 của thế kỉ XX, Việt Nam buộc phải tiến hành cuộc chiến tranh bảo vệ biên giới phía Tây Nam để chống lại:", ["Quân Khmer Đỏ", "Quân xâm lược Trung Quốc", "Quân xâm lược Campuchia", "Quân xâm lược Lào"], 0], ["Đại hội V của Đảng được tổ chức ở Hà Nội vào năm nào?", ["1952", "1862", "1972", "1982"], 3], ["Điền từ thích hợp vào chỗ trống: Đại hội V của Đảng (1982) đã xác định nội dung, bước đi, cách làm thực hiện công nghiệp hoá xã hội chủ nghĩa trong chặng đường đầu tiên là: “Tập trung phát triển mạnh ……, coi …… là mặt trận hàng đầu, đưa …… một bước lên sản xuất lớn xã hội chủ nghĩa, ra sức đẩy mạnh phát triển hàng tiêu dùng và hàng xuất khẩu.”", ["Công nghiệp nặng", "Công nghiệp nhẹ", "Nông nghiệp", "Thương nghiệp"], 2], ["Hội nghị Trung ương 8 (6/1985) được coi là bước đột phá thứ hai trong quá trình tìm tòi, đổi mới kinh tế của Đảng vì tại Hội nghị này, Trung ương đã quyết định:", ["Đổi mới đất nước một cách toàn diện trên tất các ngành và lĩnh vực", "Xoá bỏ cơ chế tập trung quan liêu, bao cấp chuyển sang cơ chế hạch toán kinh doanh", "Đề ra mục tiêu đến năm 2020 nước ta cơ bản trở thành một nước công nghiệp theo hướng hiện đại", "Chủ trương chuyển dùng tem phiếu sang dùng hoàn toàn tiền mặt"], 1], ["Đại hội V của Đảng (3/1982) đã xác định cách mạng Việt Nam có hai nhiệm vụ chiến lược là:", ["Xây dựng thành công chế độ làm chủ tập thể, bao cấp và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa", "Xây dựng thành công chủ nghĩa xã hội và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa", "Thực hiện chuyên chính tư sản và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa", "Vạch ra chiến lược kinh tế xã hội cho chặng đường đầu tiên và bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa"], 1], ["Hội nghị Bộ Chính trị khoá V (8/1986) đã nhận định đặc trưng của thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta là:", ["Nền kinh tế có cơ cấu nhiều thành phần", "Nền kinh tế chủ yếu dựa vào các doanh nghiệp nhà nước", "Nền kinh tế lấy tự cung, tự cấp làm nền tảng", "Nền kinh tế sản xuất hàng hoá nhỏ nên được loại bỏ"], 0], ["Tổng kết thời kỳ 10 năm (1976 - 1986), cách mạng Việt Nam đã đạt được một số thành tựu nổi bật. Một trong số đó là:", ["Nền kinh tế có bước phát triển vượt bậc, đời sống người dân ngày càng được cải thiện", "Đưa tỉ lệ lạm phát thấp xuống mức kỷ lục", "Đạt được những thắng lợi to lớn trong sự nghiệp bảo vệ Tổ quốc và làm nghĩa vụ quốc tế", "Có mối quan hệ ngoại giao với hầu hết các quốc gia trên thế giới"], 2], ["Đại hội VI của Đảng (12/1986) diễn ra trong bối cảnh lịch sử nào?", ["Xu thế đối đầu chi phối các mối quan hệ quốc tế", "Thế giới bắt đầu bước vào cục diện “Chiến tranh lạnh”", "Việt Nam đang ở trong tình trạng khủng hoảng kinh tế - xã hội", "Việt Nam đã thoát ra khỏi tình trạng khủng hoảng kinh tế - xã hội"], 2], ["Điền từ thích hợp vào chỗ trống: Đại hội VI của Đảng đã nhìn thẳng vào ……, đánh giá đúng ..…, nói rõ ….., đánh giá thành tựu, nghiêm túc kiểm điểm, chỉ rõ những sai lầm, khuyết điểm của Đảng trong thời kì 1975 - 1986", ["Hiện trạng", "Thực tế", "Tình hình", "Sự thật"], 3], ["Đại hội VI của Đảng (12/1986) đã nghiêm túc nhìn nhận những hạn chế, sai lầm và khuyết điểm của thời kì 1975 - 1986 là do:", ["Có những khuyết điểm trong hoạt động tư tưởng, tổ chức và công tác cán bộ của Đảng", "Ảnh hưởng bởi sự bao vây cấm vận của các nước tư bản chủ nghĩa", "Không nhận được sự viện trợ kịp thời từ hệ thống các nước xã hội chủ nghĩa", "Người dân không có sự hợp tác đối với các chủ trương, đường lối của Đảng"], 0], ["Ba chương trình kinh tế lớn được Đại hội VI (12/1986) đề ra bao gồm:", ["Hàng lương thực - thực phẩm, hàng tiêu dùng và hàng nhập khẩu", "Hàng lương thực - thực phẩm, hàng sản xuất và hàng nhập khẩu", "Hàng lương thực - thực phẩm, hàng tiêu dùng và hàng xuất khẩu", "Hàng lương thực - thực phẩm, hàng sản xuất và hàng xuất khẩu"], 2], ["Đại hội VI của Đảng (12/1986) đã xác định cần phải tăng cường tình hữu nghị và hợp tác toàn diện với:", ["Trung Quốc", "Mỹ", "Liên Xô", "Châu Âu"], 2], ["Đại hội VI của Đảng (1986) đã rút ra bài học quý báu, đó là trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng:", ["Lấy dân làm gốc", "Lấy nông làm chính", "Lấy nước làm đầu", "Lấy Đảng làm trọng"], 0], ["Ưu điểm nổi bật của Nghị quyết 10 về khoán sản phẩm cuối cùng đến nhóm hộ và hộ xã viên) đã được Bộ Chính trị (4/1988) thông qua là:", ["Chỉ có những người không nợ thuế nông nghiệp mới được tham gia vào Hợp tác xã", "Người dân được giảm thuế nông nghiệp lên tới 50%", "Người dân được nhận khoán và canh tác trên diện tích ổn định trong vòng 15 năm, đảm bảo có thu nhập từ 40% sản lượng khoán trở lên", "Tất cả các hộ gia đình nông dân đều được chia ruộng theo diện tích bằng nhau"], 2], ["Việt Nam đã bình thường hoá quan hệ với Mỹ vào năm nào?", ["1990", "1993", "1995", "1997"], 2], ["Điền từ còn thiếu vào chỗ trống: “Trong hệ thống chính trị, …… là một bộ phận và là tổ chức lãnh đạo hệ thống đó, lấy Chủ nghĩa Mác - Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động, lấy ……làm nguyên tắc tổ chức cơ bản.”", ["Nhà nước - đa số thắng tiểu số", "Chính phủ - phê bình và tự phê bình", "Đảng Cộng sản - tập trung dân chủ", "Nhân dân - tập trung dân chủ"], 2], ["Về phương diện kinh tế, thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội ở Việt Nam có đặc điểm gì?", ["Còn tồn tại nhiều giai cấp, tầng lớp xã hội vừa hợp tác, vừa đấu tranh với nhau", "Còn tồn tại nền kinh tế nhiều thành phần, trong đó có thành phần đối lập", "Vận hành theo cơ chế quan liêu bao cấp", "Thực hiện nguyên tắc làm theo năng lực hưởng theo nhu cầu"], 1], ["Tại hội nghị Trung ương 6 (3/1989) Đảng xác định yếu tố nào là nền tảng tư tưởng của Đảng, chỉ đạo toàn bộ sự nghiệp cách mạng của nhân dân ta?", ["Chủ nghĩa tự do", "Chủ nghĩa Mác - Lênin", "Chủ nghĩa Tam dân", "Chủ nghĩa nhân đạo"], 1], ["Điền từ còn thiếu vào chỗ trống: Nghị quyết Đại hội VII của Đảng đã đưa ra quan điểm coi …… là nhân tố quyết định, là động lực to lớn, là chủ thể sáng tạo mọi nguồn của cải, vật chất là tinh thần của xã hội, là mục tiêu phấn đấu cao nhất của Đảng", ["Nhân dân", "Con người", "Khoa học, kỹ thuật", "Kinh tế"], 1], ["Lần đầu tiên Đảng tổ chức Hội nghị đột xuất giữa nhiệm kì (1/1994) để chỉ ra những nguy cơ to lớn mà cách mạng Việt Nam đang phải đối mặt. Đó là:", ["Mất dân chủ, mất quyền lãnh đạo Đảng, chệch hướng chủ nghĩa xã hội", "Tụt hậu về kinh tế, chệch hướng xã hội chủ nghĩa, nạn tham nhũng và nguy cơ “diễn biến hoà bình”", "Mất quyền lãnh đạo Đảng, mất cân đối nền kinh tế, nguy cơ “diễn biến hoà bình”", "Chệch hướng xã hội chủ nghĩa, tụt hậu về kinh tế, mất dân chủ"], 1], ["Báo cáo chính trị của ban Chấp hành Trung ương tại Đại hội VIII (1996) đã bổ sung đặc trưng tổng quát về mục tiêu xây dựng chủ nghĩa xã hội ở Việt Nam là:", ["Dân giàu, nước mạnh, xã hội công bằng, văn minh", "Làm theo năng lực, hưởng theo nhu cầu", "Một xã hội bình yên không bao giờ thay đổi", "Nới rộng khoảng cách giàu nghèo"], 0], ["Quan điểm về công nghiệp hoá trong thời kỳ mới được Đại hội VIII thông qua đã xác định công nghiệp hoá, hiện đại hoá là sự nghiệp của toàn dân, của mọi thành phần kinh tế, trong đó thành phần kinh tế giữ vai trò chủ đạo là:", ["Kinh tế nhà nước", "Kinh tế tư nhân", "Kinh tế có vốn đầu tư nước ngoài", "Kinh tế hỗn hợp"], 0], ["Hội nghị Trung ương 2 khoá VIII (12/1996) đã ban hành hai nghị quyết quan trọng, nhấn mạnh coi những yếu tố nào dưới đây là quốc sách hàng đầu, là nhân tố quyết định tăng trưởng kinh tế và phát triển xã hội?", ["Giáo dục - đào tạo và văn hoá", "Khoa học công nghệ và cơ sở hạ tầng", "Giáo dục - đào tạo và khoa học công nghệ", "Tài nguyên thiên nhiên và khoa học công nghệ"], 2], ["Đại hội IX của Đảng đã đề ra Chiến lược phát triển kinh tế - xã hội 10 năm tiếp theo (2001 - 2010) với mục tiêu tổng quát là:", ["Tạo ra nền tảng cơ bản để đến năm 2020 nước ta cơ bản trở thành một nước công nghiệp theo hướng hiện đại", "Đổi mới mô hình tăng trưởng, cơ cấu lại nền kinh tế", "Hoàn thiện thể chế, phát triển kinh tế thị trường định hướng xã hội chủ nghĩa", "Xây dựng và hoàn thiện nhà nước pháp quyền xã hội chủ nghĩa"], 0], ["Hội nghị Trung ương 5 (3/2002) đã thảo luận và thống nhất nhận thức coi yếu tố nào dưới đây là bộ phận cấu thành quan trọng của nền kinh tế quốc dân?", ["Doanh nghiệp nhà nước", "Kinh tế tập thể", "Kinh tế có vốn đầu tư nước ngoài", "Kinh tế tư nhân"], 3], ["Chủ đề của Đại hội X của Đảng (2006) là: “Nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, phát huy sức mạnh toàn dân tộc, đẩy mạnh toàn diện công cuộc đổi mới, sớm đưa nước ta .……” . Từ còn thiếu trong chỗ trống là:", ["Trở thành nước công nghiệp hiện đại", "Thoát khỏi nhóm quốc gia nghèo", "Ra khỏi tình trạng kém phát triển", "Gia nhập nhóm các nước phát triển"], 2], ["Tại Đại hội X, Đảng đã lần đầu tiên đặt chú trọng đến nhiệm vụ:", ["Xây dựng nhà nước pháp quyền", "Xây dựng, chỉnh đốn Đảng", "Xây dựng nền văn hoá Việt Nam tiên tiến, đậm đà bản sắc dân tộc", "Đổi mới căn bản, toàn diện giáo dục"], 1], ["Hội nghị Trung ương 7 (3/2003) đã thống nhất nhận thức coi yếu tố nào dưới đây là tài nguyên quốc gia vô cùng quý giá, là tư liệu sản xuất đặc biệt, là nguồn nội lực và nguồn vốn to lớn của đất nước?", ["Khoáng sản", "Đất đai", "Rừng nguyên sinh", "Hệ sinh thái"], 1], ["Quan điểm của Đảng và Nhà nước ta trong vấn đề tôn giáo là:", ["Khuyến khích người dân tham gia đạo Phật", "Công nhận truyền thống cúng ông b u đổi mới", "Luôn phải có sự sáng tạo, thay đổi chủ nghĩa Mác - Lênin, Tư tưởng Hồ Chí Minh", "Thay đổi mục tiêu độc lập dân tộc và chủ nghĩa xã hội cho phù hợp với hoàn cảnh mới", "Ưu tiên tăng trưởng kinh tế so với việc thực hiện tiến bộ và công bằng xã hội"], 0], ["Theo số liệu từ Tổng cục Thống kê, GDP bình quân đầu người năm 2010 của Việt Nam đạt:", ["1.100USD", "2.100USD", "3.100USD", "4.100USD"], 0], ["Quan điểm chủ đạo của Hội nghị Trung ương 9 khoá XI đã coi văn hoá phải được đặt ngang hàng với:", ["Kinh tế, chính trị, xã hội", "Khoa học, công nghệ và giáo dục", "Y tế, giáo dục", "Khoa học, giáo dục"], 0], ["Trong xây dựng văn hoá, trọng tâm là:", ["Tăng cường dạy ngoại ngữ cho nhân dân", "Xây dựng thêm các chùa để mở rộng không gian sinh hoạt tâm linh", "Chăm lo xây dựng con người có nhân cách và lối sống tốt đẹp", "Tuyên truyền, phổ biến đạo Phật vào trong đời sống người dân"], 2], ["Đâu là mục tiêu Thiên niên kỷ mà Việt Nam đã hoàn thành trước năm 2015?", ["Xoá bỏ tình trạng nghèo đói cùng cực", "Tăng cường bình đẳng giới và nâng cao vị thế cho phụ nữ", "Nâng cao sức khoẻ bà mẹ trẻ em", "Ngăn chặn HIV/AIDS, sốt rét và các bệnh dịch khác"], 0], ["Quan điểm chỉ đạo của Đảng trong Nghị quyết Trung ương 4 khoá X đã chỉ rõ yếu tố nào dưới đây là bộ phận cấu thành chủ quyền thiêng liêng của Tổ quốc, là không gian sinh tồn, cửa ngõ giao lưu quốc tế?", ["Đất", "Biển", "Biên giới", "Rừng"], 1], ["Đâu là vấn đề được hội nghị Trung ương 4 khoá XI (1/2012) coi là nhiệm vụ cơ bản, lâu dài, phải thực hiện thường xuyên, có hiệu quả?", ["Thay đổi tên Đảng", "Thay đổi giai cấp lãnh đạo cách mạng cho phù hợp", "Tự diễn biến, tự chuyển hoá", "Phòng chống tham nhũng"], 3], ["Tổ chức nào dưới đây là cơ quan thường trực của Ban Chỉ đạo Trung ương về phòng, chống tham nhũng?", ["Ban Kinh tế", "Ban Nội chính Trung ương", "Uỷ ban kiểm tra Trung ương", "Văn phòng Chính phủ"], 1], ["Một trong những thành tựu quan trọng nhất mà Đảng và nước ta đã đạt được trong hơn 30 năm tiến hành công cuộc đổi mới là:", ["Đã xây dựng và hoàn thiện từng bước nền kinh tế thị trường định hướng xã hội chủ nghĩa", "Đã cơ bản hoàn thành việc phổ cập giáo dục bậc Đại học trong nhân dân", "Xoá bỏ hoàn toàn sự phân hoá giàu nghèo", "Đa số người dân hiện nay đều sống ở khu vực thành thị"], 0], ["Thành tựu nào dưới đây của Việt Nam trong những năm vừa qua đã được Liên Hợp Quốc và cộng đồng quốc tế công nhận, đánh giá cao?", ["Bảo vệ môi trường", "Đột phá trong giáo dục", "Giảm nghèo", "Giảm tệ nạn xã hội"], 2], ["Một trong những kinh nghiệm mà Đảng đã nhận thức sâu sắc trong quá trình hơn 30 năm lãnh đạo công cuộc đổi mới là:", ["Quán triệt tinh thần lấy dân làm gốc, vì lợi ích của nhân dân", "Thay đổi mục tiêu độc lập dân tộc và chủ nghĩa xã hội", "Làm từng phần, chia nhỏ từng ngành, từng lĩnh vực", "Đặt lợi ích của Đảng, của Nhà nước lên trên hết"], 0], ["Trong xây dựng Đảng, nhân tố nào được xem là mang tính quyết định sự thành bại của cách mạng, là khâu then chốt?", ["Đào tạo nhân tài", "Bồi dưỡng trí thức", "Kết nạp đảng viên", "Công tác cán bộ"], 3], ["Cơ chế vận hành của hệ thống chính trị ở nước ta hiện nay là:", ["Chính phủ lãnh đạo, Nhà nước quản lý, Đảng làm chủ", "Chính phủ lãnh đạo, người dân quản lý, Nhà nước làm chủ", "Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ", "Đảng lãnh đạo, nhân dân quản lý, Nhà nước làm chủ"], 2], ["Điền từ còn thiếu vào chỗ trống: “Đảng ta xứng đáng là lực lượng lãnh đạo Nhà nước và xã hội. Đất nước ta chưa bao giờ có được cơ đồ và vị thế như ngày nay. Đó là kết quả sự nỗ lực phấn đấu không ngừng của toàn Đảng, toàn dân, toàn quân, trong đó có sự hy sinh quên mình của ……. Chúng ta có quyền tự hào về bản chất tốt đẹp, truyền thống anh hùng và lịch sử vẻ vang của Đảng ta - Đảng của Chủ tịch Hồ Chí Minh vĩ đại, đại biểu của dân tộc Việt Nam anh hùng.” (Trích Nghị quyết Hội nghị lần thứ tư Ban Chấp hành Trung ương Đảng khoá XII)", ["Công nhân, nông dân", "Cán bộ, đảng viên", "Tiểu thương, tri thức", "Công nhân, viên chức"], 1] const $=s=>document.querySelector(s),main=$('#main'),L='ABCD';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrong=new Set(LS.get('lsd_wrong',[])),S=null,T=null;const saveW=()=>LS.set('lsd_wrong',[...wrong]);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const N=Q.map(q=>norm(q[0]+' '+q[1].join(' ')));
const tab=n=>{clearInterval(T);$('#t1').setAttribute('aria-current',n==1);$('#t2').setAttribute('aria-current',n==2);n==1?home():browse();scrollTo(0,0)};
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
function home(){
 let r='<option value="all">Tất cả 270 câu</option>';for(let i=0;i<9;i++)r+=`<option value="${i*30}-${i*30+30}">Câu ${i*30+1} – ${i*30+30}</option>`;
 main.innerHTML=`<section class="card"><h2>Luyện tập</h2><p class="m">Chọn đáp án là biết đúng sai ngay, kèm đáp án đúng.</p>
 <label>Phạm vi<select id="rg">${r}</select></label><label class="chk"><input type="checkbox" id="sh" checked>Xáo trộn thứ tự câu</label>
 <button class="pri" id="go">Bắt đầu luyện tập</button></section>
 <section class="card"><h2>Thi thử</h2><p class="m">Đề ngẫu nhiên, 1 phút mỗi câu, báo đúng sai ngay khi chọn, tổng điểm khi nộp bài.</p>
 <label>Số câu<select id="ne"><option>20<option selected>40<option>60<option>100</select></label><button class="pri" id="ex">Vào thi</button></section>
 <section class="card"><h2>Câu đã làm sai</h2><p class="m">${wrong.size?`Có <b>${wrong.size}</b> câu cần ôn lại.`:'Chưa có câu sai. Câu bạn làm sai sẽ được lưu ở đây.'}</p>
 <button class="pri" id="wr" ${wrong.size?'':'disabled'}>Ôn lại câu sai</button> ${wrong.size?'<button id="cw">Xoá danh sách</button>':''}</section>`;
 $('#go').onclick=()=>{const v=$('#rg').value;let ids=Q.map((_,i)=>i);if(v!='all'){const[a,b]=v.split('-').map(Number);ids=ids.slice(a,b)}start($('#sh').checked?shuffle(ids):ids,'p','all')};
 $('#ex').onclick=()=>start(shuffle(Q.map((_,i)=>i)).slice(0,+$('#ne').value),'e','exam');
 $('#wr').onclick=()=>start(shuffle([...wrong]),'p','wrong');
 const c=$('#cw');if(c)c.onclick=()=>{wrong.clear();saveW();home()};
}
function start(ids,mode,src){clearInterval(T);S={ids,mode,src,i:0,ans:[],t0:Date.now(),lim:mode=='e'?ids.length*60:0};if(S.lim)T=setInterval(tick,1000);run();scrollTo(0,0)}
function tick(){const r=Math.max(0,S.lim-(Date.now()-S.t0)/1000|0),e=$('#tm');if(e)e.textContent=(r/60|0)+':'+String(r%60).padStart(2,'0');if(r<=0)finish()}
function run(){
 const s=S,id=s.ids[s.i],q=Q[id],a=s.ans[s.i],p=s.mode=='p',done=a!=null,last=s.i==s.ids.length-1;
 const cl=k=>done?(k==q[2]?'ok':k==a?'bad':''):'';
 main.innerHTML=`<div class="bar"><span>Câu ${s.i+1}/${s.ids.length}</span><span class="tag">Câu gốc ${id+1}</span>${p?'':'<span id="tm"></span>'}</div>
 <div class="prog"><i style="width:${(s.i+1)/s.ids.length*100}%"></i></div><h2 class="stem">${esc(q[0])}</h2>
 ${q[1].map((o,k)=>`<button class="opt ${cl(k)}" data-k="${k}"><b>${L[k]}</b><span>${esc(o)}</span></button>`).join('')}
 <div class="nav">${p?(done?`<button class="pri" data-a="${last?'fin':'next'}">${last?'Xem kết quả':'Câu tiếp theo'}</button>`:''):
 `<button data-a="prev" ${s.i?'':'disabled'}>Câu trước</button><button data-a="next" ${last?'disabled':''}>Câu sau</button><button class="pri sp" data-a="fin">Nộp bài</button>`}</div>
 ${p?'':`<div class="grid">${s.ids.map((_,k)=>`<button class="g ${s.ans[k]!=null?'a':''} ${k==s.i?'c':''}" data-g="${k}">${k+1}</button>`).join('')}</div>`}`;
 if(!p)tick();
}
function pick(k){const s=S;if(!s||k>3)return;const id=s.ids[s.i];
 if(s.ans[s.i]!=null)return;s.ans[s.i]=k;if(k==Q[id][2]){if(s.src=='wrong')wrong.delete(id)}else wrong.add(id);saveW();run()}
function go(d){const n=S.i+d;if(n>=0&&n<S.ids.length){S.i=n;run();scrollTo(0,0)}}
function finish(){
 clearInterval(T);const s=S;let ok=0;const bad=[];
 s.ids.forEach((id,k)=>{if(s.ans[k]===Q[id][2])ok++;else bad.push(k)});
 if(s.mode=='e'){bad.forEach(k=>wrong.add(s.ids[k]));saveW()}
 const n=s.ids.length,sec=Math.min(s.lim||1e9,(Date.now()-s.t0)/1000|0);
 main.innerHTML=`<section class="card"><p class="m">${s.mode=='e'?'Kết quả thi thử':'Kết quả luyện tập'}</p><div class="big">${ok}/${n}</div>
 <p>Đúng ${(ok/n*100).toFixed(0)}%${s.mode=='e'?` · Điểm ${(ok/n*10).toFixed(1)}/10 · Thời gian ${(sec/60|0)} phút ${sec%60} giây`:''}</p>
 <div class="nav">${bad.length?`<button class="pri" data-a="retry">Ôn lại ${bad.length} câu sai</button>`:''}<button data-a="home">Về trang chủ</button></div></section>
 ${bad.length?'<h2>Các câu sai</h2>':'<p>Bạn trả lời đúng tất cả.</p>'}
 ${bad.map(k=>{const id=s.ids[k],q=Q[id],a=s.ans[k];return`<article class="item"><h3><span class="tag">#${id+1}</span> ${esc(q[0])}</h3>
 <p class="no">${a==null?'Bạn chưa trả lời.':`Bạn chọn: <b>${L[a]}.</b> ${esc(q[1][a])}`}</p><ul><li class="ok"><b>${L[q[2]]}.</b>${esc(q[1][q[2]])}</li></ul></article>`}).join('')}`;
 S.bad=bad.map(k=>s.ids[k]);scrollTo(0,0)}
main.onclick=e=>{const t=e.target.closest('[data-k],[data-g],[data-a]');if(!t||!S)return;
 if(t.dataset.k!=null)pick(+t.dataset.k);else if(t.dataset.g!=null){S.i=+t.dataset.g;run()}
 else{const a=t.dataset.a;if(a=='next')go(1);else if(a=='prev')go(-1);else if(a=='fin'){if(S.mode=='e'&&S.ans.filter(x=>x!=null).length<S.ids.length&&!confirm('Bạn còn câu chưa trả lời. Vẫn nộp bài?'))return;finish()}
 else if(a=='retry')start(shuffle(S.bad),'p','wrong');else if(a=='home')tab(1)}};
document.onkeydown=e=>{if(!S||!$('.stem')||/INPUT|SELECT/.test(e.target.tagName))return;const k='abcd1234'.indexOf(e.key.toLowerCase());
 if(k>=0)pick(k%4);else if(e.key=='ArrowRight'||e.key=='Enter'){const b=$('[data-a=next],[data-a=fin]');if(b&&!b.disabled&&(S.mode=='p'||e.key=='ArrowRight'))b.click()}else if(e.key=='ArrowLeft'&&S.mode=='e')go(-1)};
function browse(){
 main.innerHTML='<input type="search" id="sq" placeholder="Tìm theo từ khoá (gõ có dấu hoặc không dấu)"><p class="m" id="cnt"></p><div id="ls"></div>';
 const draw=()=>{const k=norm($('#sq').value.trim()),r=[];N.forEach((t,i)=>{if(!k||t.includes(k))r.push(i)});$('#cnt').textContent=r.length+' câu';
  $('#ls').innerHTML=r.map(i=>{const q=Q[i];return`<article class="item"><h3><span class="tag">#${i+1}</span> ${esc(q[0])}</h3><ul>${q[1].map((o,j)=>`<li class="${j==q[2]?'ok':''}"><b>${L[j]}.</b>${esc(o)}</li>`).join('')}</ul></article>`}).join('')};
 $('#sq').oninput=draw;draw()}
home();
</script></body></html>
